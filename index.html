<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kervano : jeu de plateau-quiz en famille. Islam, christianisme, judaïsme, histoire, géographie, sciences, maths, culture générale. Duo, Carré ou Cash, en ligne et en 6 langues.">
<meta name="theme-color" content="#1E2A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kervano">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Kervano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Figtree:wght@400;600;800&family=Noto+Sans+Arabic:wght@400;600;800&display=swap">
<style>
/* Layout : un plateau de jeu illustré posé sur une table sombre ; le dé et le joueur courant en bas ; la carte-question monte depuis le bas comme une carte qu'on tire. Univers unique (nuit + sable), assumé dans les deux thèmes. */
:root{
  color-scheme:dark;
  --table:#1B1530; --table2:#261D42; --card:#FFF8EA; --ink:#2A2118; --muted:#7A6A55; --cream:#F6E9CF; --gold:#F2B441; --gold2:#C98A1B;
  --ok:#2E9E5B; --ko:#D2493A; --duo:#3D7FD6; --carre:#E7A52C; --cash:#D2493A;
  --c-coran:#2E9E5B; --c-sira:#E8862F; --c-prophetes:#3D7FD6; --c-piliers:#D24B6A; --c-histoire:#8A5CD0; --c-culture:#E2B72E; --c-adab:#139C9A;
  --f-display:"Reem Kufi", "Noto Sans Arabic", "Trebuchet MS", sans-serif; --f-body:"Figtree", "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0,var(--table2),var(--table));color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:12px;padding-block:0;overflow-x:hidden;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;position:relative;padding-bottom:150px}
/* barre du haut */
.top{display:flex;align-items:center;gap:8px;padding-block:10px 6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--table) 70%,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;flex:none;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);font-size:14px;font-weight:700;transition:transform .3s,background .3s}
.chip.cur{background:rgba(242,180,65,.22);border-color:var(--gold);transform:scale(1.05)}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.chip .av svg{width:20px;height:16px}
.chip small{font-weight:600;opacity:.75}
.chip .fire{color:var(--gold);font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
/* plateau */
.stage{padding-top:4px}
/* plateau 3D : la scène est une caméra, le plateau (.plane) est posé en perspective ; pions et décor sont des figurines debout */
.scene{position:relative;width:100%;aspect-ratio:360/580;perspective:1100px;perspective-origin:50% 8%;overflow:hidden;border-radius:18px;touch-action:pan-y}
.plane{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;transform-style:preserve-3d;--tilt:34deg}
.plane .lay{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.frame{position:absolute;inset:-10px;border-radius:22px;background:linear-gradient(145deg,#8A5A34,#3E2614);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 60px 10px rgba(0,0,0,.6);transform:translateZ(-1px)}
.edge{position:absolute;left:2px;right:2px;top:calc(100% + 10px);height:18px;border-radius:0 0 14px 14px;background:linear-gradient(#3E2614,#1E1008);transform-origin:50% 0;transform:rotateX(-90deg)}
.edge.l{left:-10px;right:auto;top:6px;bottom:6px;width:18px;height:auto;border-radius:14px 0 0 14px;background:linear-gradient(90deg,#1E1008,#3E2614);transform-origin:0 50%;transform:rotateY(90deg)}
.edge.r{left:auto;right:-10px;top:6px;bottom:6px;width:18px;height:auto;border-radius:0 14px 14px 0;background:linear-gradient(90deg,#3E2614,#1E1008);transform-origin:100% 50%;transform:rotateY(-90deg)}
.bb,.pw{position:absolute;left:0;top:0;transform-origin:50% 100%}
.bb svg,.pw svg{display:block;width:100%;height:100%;overflow:visible}
.psh{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(40,20,0,.55),rgba(40,20,0,0))}
.probe{position:absolute;left:0;top:0;width:2px;height:2px;margin:-1px}
/* langues */
.langrow{display:flex;justify-content:flex-end;margin-bottom:4px}
.langbox{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:var(--cream)}
.langbox svg,.hero .langbox svg{width:18px;height:18px;flex:none}
.langbox select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:inherit;font:700 15px var(--f-body);padding:4px 6px;outline:none}
.langbox select option{color:#2A2118}
[dir=rtl] .chip{padding:4px 4px 4px 10px}
[dir=rtl] .x{margin-left:0}
body.spectate #card input{pointer-events:none;opacity:.6}
/* réponse écrite */
.typed{display:flex;gap:8px;margin:12px 0 4px}
.typed input{flex:1;min-width:0;font:600 17px var(--f-body);padding:12px 14px;border-radius:14px;border:2px solid #E3D3B3;background:#fff;color:var(--ink);outline:none}
.typed input:focus{border-color:var(--gold2)}
.typed .big{flex:none;width:auto;padding:10px 16px;min-height:50px;font-size:16px;box-shadow:0 4px 0 #8A5A0C}
#zone .row{display:flex;gap:8px}#zone .row>button{flex:1 1 0;min-width:0}
/* jeu en ligne */
.netcode{font:900 46px var(--f-display);letter-spacing:.2em;text-align:center;color:var(--gold);margin:4px 0 14px}
.pname{flex:1;font-weight:800}.plev{opacity:.7;text-transform:capitalize}
body.spectate #dock button,body.spectate #card button,body.spectate #cardfx button{pointer-events:none;filter:saturate(.6);opacity:.6}
body.spectate #dock .dice{opacity:1}
body.spectate #card button.st{pointer-events:auto;filter:none;opacity:1}
/* vue 3D à la première personne */
.w3d{position:fixed;inset:0;z-index:45;opacity:0;pointer-events:none;transition:opacity .45s ease;background:#EFC89A}
.w3d.on{opacity:1}
.w3d.board{z-index:2;transition:opacity .9s ease}
.w3d .w3hud{opacity:0;transition:opacity .3s}.w3d.fp .w3hud{opacity:1}
body.b3d .stage{visibility:hidden}
body.b3d .top{background:linear-gradient(rgba(12,9,24,.7),rgba(12,9,24,0))}
.w3d canvas{display:block;width:100%;height:100%}
.w3d::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(40,20,5,.45));pointer-events:none}
.w3hud{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(20,14,36,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFF6E0;font-weight:800;z-index:1}
.w3hud i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #FFF6E0}
.w3hud small{opacity:.8;font-weight:700}
button{touch-action:manipulation}
.dock{z-index:50}.sheet{z-index:60}.cardfx{z-index:70}.win{z-index:80}.toast{z-index:75}#fx{z-index:90}
.shield{color:#7FD1FF;font-weight:800}
#board{position:absolute;left:0;top:0;display:block;width:360px;height:640px;border-radius:16px}
.sq-num{font:800 9px var(--f-body);fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
.pw .pbody{width:100%;height:100%}
.pw.cur .pbody{animation:bounce 1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes bounce{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pw.cur .pbody,.pulse{animation:none}}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(12,9,24,.92) 30%);display:flex;justify-content:center}
.dock-in{width:100%;max-width:560px;display:flex;align-items:center;gap:14px}
.dock .who{flex:1;min-width:0}
.dock .who small{display:block;font-size:13px;opacity:.75;font-weight:600}
.dock .who b{font-family:var(--f-display);font-size:24px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{border:0;border-radius:18px;padding:14px 22px;font-weight:800;font-size:18px;background:linear-gradient(180deg,#FFD068,var(--gold2));color:#2A1A05;box-shadow:0 6px 0 #8A5A0C,0 10px 20px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;min-height:56px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8A5A0C}
.big:disabled{filter:grayscale(.6);opacity:.6}
.big.w{width:100%}
/* dé 3D */
.dice{width:62px;height:62px;perspective:400px;flex:none;pointer-events:none;direction:ltr}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.9,.3,1.15)}
.face{position:absolute;inset:0;background:#FFFDF6;border-radius:12px;border:2px solid #E4D2AE;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.face i{border-radius:50%;background:#2A2118;visibility:hidden;margin:1px}
.face i.on{visibility:visible}
.f1{transform:rotateY(0) translateZ(31px)}.f2{transform:rotateY(90deg) translateZ(31px)}.f3{transform:rotateX(90deg) translateZ(31px)}
.f4{transform:rotateX(-90deg) translateZ(31px)}.f5{transform:rotateY(-90deg) translateZ(31px)}.f6{transform:rotateY(180deg) translateZ(31px)}
/* carte question */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet .card{pointer-events:auto;width:100%;max-width:560px;max-height:84vh;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open .card{transform:none}
.band{display:flex;align-items:center;gap:10px;padding:14px 18px;color:#fff;font-family:var(--f-display);font-size:19px;font-weight:700;position:sticky;top:0;z-index:1}
.band .sp{flex:1}
.band .pill{font-family:var(--f-body);font-size:13px;font-weight:800;background:rgba(0,0,0,.2);padding:3px 10px;border-radius:999px;white-space:nowrap;flex:none}
.cbody{padding:16px 18px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.qfor{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtext{font-size:clamp(21px,5.4vw,26px);font-weight:700;line-height:1.3}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{border:0;border-radius:18px;padding:12px 4px 10px;color:#fff;display:grid;gap:1px;justify-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px)}
.mode b{font-family:var(--f-display);font-size:25px;line-height:1}
.mode span{font-size:12px;font-weight:700;opacity:.95}
.mode em{font-style:normal;font-size:26px;font-weight:800;line-height:1.1}
.mode small{font-size:11px;font-weight:800;background:rgba(0,0,0,.2);border-radius:999px;padding:1px 8px}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{text-align:start;border:2.5px solid #E6D6B6;background:#FFFDF6;border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;color:var(--ink);transition:transform .15s}
.choice:active{transform:scale(.98)}
.choice.right{border-color:var(--ok);background:#E3F5EA;animation:pop .4s}
.choice.wrong{border-color:var(--ko);background:#FBE5E2;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{border-radius:16px;padding:12px 14px;background:#E3F5EA;border:2.5px solid var(--ok)}
.answer b{font-size:21px}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:0}
.note{font-size:15px;color:var(--muted);margin:0}
.heard{border-radius:16px;padding:12px 14px;border:2.5px dashed #E0CDA6;display:grid;gap:4px}
.heard q{font-size:20px;font-weight:800;quotes:"« " " »"}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{border:0;border-radius:16px;min-height:56px;font-size:19px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.judge .yes{background:var(--ok)}.judge .no{background:var(--ko)}
.judge .sugg{outline:4px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ghostbtn{border:2px solid #E0CDA6;background:transparent;border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink);min-height:48px;flex:1}
.setup .ghostbtn{color:var(--cream);border-color:rgba(255,255,255,.3)}
.mic{border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--ink);color:var(--card);min-height:48px;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mic.rec{background:var(--ko);animation:pulseb 1s infinite}
@keyframes pulseb{50%{box-shadow:0 0 0 8px rgba(210,73,58,.25)}}
.tiny{font-size:13px;color:var(--muted);margin:0}
.timer{height:8px;border-radius:4px;background:#EADBBB;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold2);transform-origin:left}
.say{border:1.5px solid #E0CDA6;background:transparent;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;color:var(--ink)}
.votes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.votes span{display:inline-flex;align-items:center;gap:6px;background:#F4E8CF;border-radius:999px;padding:3px 10px 3px 3px;font-weight:700;font-size:14px}.votes span.ok{background:#E3F5EA}.votes .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.pickcat button:disabled{opacity:.55;filter:saturate(.6)}
.pickcat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pickcat button:last-child:nth-child(odd){grid-column:1/-1}
.pickcat button{border:0;border-radius:16px;padding:16px 8px;color:#fff;font-family:var(--f-display);font-size:17px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25)}
/* bannière résultat */
.toast{position:fixed;left:50%;top:22%;z-index:30;transform:translate(-50%,-20px) scale(.8);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1.3);text-align:center;width:min(92vw,480px)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast .t{display:inline-block;font-family:var(--f-display);font-size:clamp(30px,9vw,46px);font-weight:700;padding:10px 26px;border-radius:20px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast .s{display:block;margin-top:8px;font-weight:800;font-size:17px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.cardfx{position:fixed;inset:0;z-index:32;display:grid;place-items:center;background:rgba(10,7,20,.6);opacity:0;pointer-events:none;transition:opacity .3s;padding:20px;perspective:1200px}
.cardfx.show{opacity:1;pointer-events:auto}
.flip{width:min(78vw,300px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform:rotateY(0) scale(.7)}
.cardfx.turned .flip{transform:rotateY(180deg) scale(1)}
.cside{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden}
.cback{background:repeating-linear-gradient(45deg,#8A5A0C 0 10px,#A8711A 10px 20px);border:6px solid #F2B441;display:grid;place-items:center}
.cback span{font-family:var(--f-display);font-size:64px;color:#FFE3A0;text-shadow:0 3px 0 #5B3A08}
.cfront{transform:rotateY(180deg);background:var(--card);color:var(--ink);display:flex;flex-direction:column}
.cfront .ch{padding:14px 16px;color:#fff;font-family:var(--f-display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.cfront .cb{flex:1;padding:16px 18px;display:grid;align-content:center;gap:10px;text-align:center}
.cfront h3{font-size:clamp(24px,7vw,30px)}
.cfront p{margin:0;font-size:17px;font-weight:600}
.cfront .cf{padding:0 16px 16px;display:grid;gap:8px}
.cfront .pk{border:0;border-radius:12px;padding:10px;font-weight:800;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
/* accueil */
.setup{padding-block:6px 30px;display:grid;gap:14px}
.hero{display:grid;gap:10px;text-align:center;justify-items:center;padding-top:10px}
.hero h1{font-size:clamp(36px,10vw,56px);color:var(--gold);text-shadow:0 3px 0 #6B3F08}
.hero p{margin:0;opacity:.85;max-width:44ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero .logo{display:block;margin:6px auto 12px;width:min(230px,62vw);height:auto;aspect-ratio:1;border-radius:34px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.hero svg{width:min(80vw,320px);height:auto}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rule{border-radius:16px;padding:10px 8px;color:#fff;text-align:center;display:grid;gap:2px}
.rule b{font-family:var(--f-display);font-size:22px}
.rule span{font-size:12.5px;font-weight:700;line-height:1.25}
.panel{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;display:grid;gap:12px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.thb{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(255,255,255,.2);background:transparent;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;color:var(--cream)}
.thb i{width:12px;height:12px;border-radius:50%;border:2px solid var(--tc);flex:none}
.thb.on{background:var(--tc);border-color:var(--tc);color:#fff}.thb.on i{background:#fff;border-color:#fff}
.finrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:15px}
.finrow select{flex:1;min-width:0;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--cream);border-radius:12px;padding:10px 12px;font-weight:700}
.finrow select option{color:#2A2118}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.jrow input{font:900 22px var(--f-display);letter-spacing:.18em;text-transform:uppercase;text-align:center;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--gold);border-radius:12px;padding:8px 10px;min-width:0}
.jrow input::placeholder{letter-spacing:.05em;font:700 15px var(--f-body);color:rgba(246,233,207,.5)}
.jrow input.bad{border-color:var(--ko)}
.jrow button{border:0;background:var(--gold);color:#2A1A05;border-radius:12px;padding:10px 16px;font-weight:800}
.daily .dh{display:flex;align-items:center;gap:8px}.daily .dh .lab2{flex:1}
.streak{background:rgba(242,180,65,.18);color:var(--gold);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.daily .dq{font-weight:800;font-size:19px;margin:0;color:var(--cream)}
.daily .choices{display:grid;gap:8px}.daily .choice{padding:11px 14px;font-size:16px}
.daily .note{color:rgba(246,233,207,.75)}
.repbox{display:grid;gap:8px;margin:4px 0 8px}.repbox textarea{font:inherit;font-size:15px;border:1.5px solid #E0CDA6;border-radius:12px;padding:8px 10px;min-height:64px;background:#fff;color:var(--ink);resize:vertical}
body.spectate #card .repbox textarea{pointer-events:auto}
.lab2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:0;color:var(--gold)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.prow .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.prow .av svg{width:26px;height:21px}
.prow input,.prow select{border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.25);min-width:0;width:100%}
.prow select{width:auto}
.prow .x{width:40px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);font-size:20px}
.seg{display:flex;border:1.5px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-weight:800;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2A1A05}
.hint{font-size:14px;opacity:.75;margin:0}
.addbtn{border:1.5px dashed rgba(255,255,255,.3);background:transparent;border-radius:12px;padding:10px;font-weight:800}
/* victoire */
.win{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(10,7,20,.72);padding:20px;opacity:0;pointer-events:none;transition:opacity .5s}
.win.show{opacity:1;pointer-events:auto}
.win .box{background:var(--card);color:var(--ink);border-radius:26px;padding:24px 20px;width:min(100%,440px);display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.win h2{font-size:clamp(30px,8vw,42px)}
.rank{display:grid;gap:6px;text-align:start}
.win .box{max-height:calc(100dvh - 40px);overflow:auto}
.learn{display:grid;gap:10px;text-align:start}
.learn h3{margin:6px 0 0;font-size:18px}
.learn .it{background:#FBF4E4;border-radius:14px;padding:10px 12px;border-inline-start:4px solid var(--ok);display:grid;gap:4px}
.learn .it p{margin:0}.learn .qq{font-weight:700}.learn .aa{color:var(--ok);font-weight:800}
.stealmsg{background:#FFF3D6;border:2px dashed #E7A52C;border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px;margin:10px 0 0;color:#5A3A06}
.rank div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#F4E8CF;font-weight:700}
.rank .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.rank .av svg{width:22px;height:18px}
@media (max-width:400px){.rules span{font-size:11.5px}}
/* ===== Mode Salon : la TV affiche le plateau (body.tv), les téléphones servent de manettes (body.pad) ===== */
:root{--tvz:1}
.tvwait,.padhome{display:none}
/* salle d'attente sur la TV, en paysage */
body.tvl{overflow:hidden;padding:0}
body.tvl .wrap{max-width:none;padding:0;height:100dvh}
.tvlobby{height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:4vmin;align-items:center;padding:4vmin 5vmin;font-size:2.6vmin}
.tvl-left{display:grid;justify-items:center;text-align:center;gap:1.6vmin}
.tvl-left .logo{width:13vmin;height:13vmin;border-radius:3vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.45)}
.tvl-left h1{font-size:6vmin;color:var(--gold);text-shadow:0 .4vmin 0 #6B3F08}
.tvl-left p{margin:0;opacity:.9;max-width:46ch}
.tvqr{width:36vmin;height:36vmin;background:#fff;border-radius:2.4vmin;padding:1.4vmin;box-shadow:0 1.2vmin 4vmin rgba(0,0,0,.5);display:grid;place-items:center}
.tvqr svg{width:100%;height:100%;display:block}
.tvlobby .netcode{font-size:9vmin;margin:0}
.tvl-right{display:grid;gap:2vmin;align-content:center}
.tvl-right .panel{border-radius:3vmin;padding:3vmin;gap:1.6vmin}
.tvl-right .lab2{font-size:2.2vmin}
.tvpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vmin}
.tvpl div{display:flex;align-items:center;gap:1.4vmin;background:rgba(255,255,255,.08);border-radius:999px;padding:.8vmin 2vmin .8vmin .8vmin;font-weight:800;font-size:3vmin;min-width:0}
.tvpl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvpl .av{width:5vmin;height:5vmin;border-radius:50%;display:grid;place-items:center;flex:none}
.tvpl .av svg{width:3.8vmin;height:3vmin}
.tvl-right .hint{font-size:2.4vmin}
.tvl-right .big{font-size:3.4vmin;min-height:9vmin;border-radius:2.6vmin}
.tvl-right .row{display:flex;gap:1.6vmin}.tvl-right .row .ghostbtn{color:var(--cream);border-color:rgba(255,255,255,.3);font-size:2.4vmin;min-height:7vmin}
@media (orientation:portrait){.tvlobby{grid-template-columns:1fr;align-content:center;overflow:auto;font-size:2.2vmax}.tvqr{width:30vmax;height:30vmax}}
/* partie sur la TV */
body.tv{overflow:hidden}
body.tv .wrap{max-width:none;padding-bottom:0}
body.tv .top{zoom:var(--tvz);background:none;padding-inline:8px}
body.tv #snd,body.tv #quit{opacity:.55}
body.tv .scene{width:min(100%,calc((100dvh - 190px) * 360 / 580));margin:0 auto}
body.tv .dock{left:0;right:auto;background:none;padding:0 0 calc(2vh + env(safe-area-inset-bottom,0px)) 2vw;justify-content:flex-start}
body.tv .dock-in{zoom:var(--tvz);width:auto;max-width:420px;background:rgba(12,9,24,.8);border-radius:22px;padding:12px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.tv .dock-in:empty{display:none}
body.tv .sheet{left:auto;right:0;top:0;bottom:0;align-items:center;padding:2vh 2vw}
body.tv .sheet .card{zoom:var(--tvz);width:min(560px,calc(46vw / var(--tvz)));max-height:calc(94vh / var(--tvz));border-radius:26px;transform:translateX(115%);box-shadow:0 20px 60px rgba(0,0,0,.55)}
body.tv .sheet.open .card{transform:none}
body.tv .toast,body.tv .win .box,body.tv .cardfx .flip{zoom:var(--tvz)}
body.tv .win .box{max-height:calc(94vh / var(--tvz))}
body.tv.spectate #dock button,body.tv.spectate #card button,body.tv.spectate #cardfx button{filter:none;opacity:1}
body.tv #rep,body.tv #repz,body.tv #share,body.tv.spectate #say,body.tv.spectate .typed,body.tv.spectate #zone .row,body.tv.spectate #mi,body.tv.spectate #cont,body.tv.spectate #flip,body.tv.spectate #cok{display:none!important}
.tvpl b{font-weight:600;opacity:.7;font-size:.75em}
body.tv .tvwait{display:block;font-weight:800;font-size:16px;color:var(--muted);text-align:center;margin:0;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
/* téléphones-manettes */
body.pad .stage,body.pad #snd,body.pad #say{display:none}
body.pad .padhome{display:grid;justify-items:center;text-align:center;gap:10px;padding:8vh 8px 200px}
.padhome .tok{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:3px solid var(--pc)}
.padhome .tok svg{width:84px;height:84px}
.padhome h2{font-size:34px;color:var(--pc)}
.padhome .pos{font-weight:800;font-size:19px}
.padhome .stat{font-family:var(--f-display);font-size:24px;color:var(--gold);margin:6px 0 0}
.padhome .hint{max-width:30ch}
/* ===== Paysage (téléphone tourné, recopie sur la TV, tablette, ordi) : la partie tient dans l'écran, sans défiler.
   Le plateau prend toute la hauteur au centre, le dé et le joueur flottent en bas à gauche, la carte-question arrive par la droite. ===== */
@media (orientation:landscape){
body.ingame:not(.tv,.pad,.tvl){overflow:hidden;height:100dvh;min-height:0;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
body.ingame:not(.tv,.pad,.tvl) .wrap{max-width:none;padding-bottom:0;height:100dvh;display:flex;flex-direction:column}
body.ingame:not(.tv,.pad,.tvl) .top{flex:none;padding-block:calc(6px + env(safe-area-inset-top,0px)) 4px;top:0}
body.ingame:not(.tv,.pad,.tvl) .stage{flex:1;min-height:0;padding:0 0 max(6px,env(safe-area-inset-bottom,0px))}
body.ingame:not(.tv,.pad,.tvl) .scene{aspect-ratio:auto;width:100%;height:100%}
body.ingame:not(.tv,.pad,.tvl) .dock{left:env(safe-area-inset-left,0px);right:auto;background:none;padding:0 0 calc(10px + env(safe-area-inset-bottom,0px)) 12px;justify-content:flex-start}
body.ingame:not(.tv,.pad,.tvl) .dock-in{width:auto;max-width:min(42vw,400px);gap:10px;background:rgba(12,9,24,.82);border-radius:20px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.ingame:not(.tv,.pad,.tvl) .dock-in:empty{display:none}
body.ingame:not(.tv,.pad,.tvl) .dock .who b{font-size:20px}
body.ingame:not(.tv,.pad,.tvl) .dock .big{min-height:48px;padding:10px 16px;font-size:16px}
body.ingame:not(.tv,.pad,.tvl) .sheet{left:auto;right:0;top:0;bottom:0;align-items:center;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px 8px}
body.ingame:not(.tv,.pad,.tvl) .sheet .card{width:min(480px,52vw);max-height:calc(100dvh - 16px);border-radius:22px;padding-bottom:0;transform:translateX(115%);box-shadow:0 20px 60px rgba(0,0,0,.55)}
body.ingame:not(.tv,.pad,.tvl) .sheet.open .card{transform:none}
body.ingame:not(.tv,.pad,.tvl) .band{padding:10px 16px}
body.ingame:not(.tv,.pad,.tvl) .cbody{padding:12px 16px 16px;gap:10px}
body.ingame:not(.tv,.pad,.tvl) .qtext{font-size:clamp(18px,2.6vw,24px)}
body.ingame:not(.tv,.pad,.tvl) .toast{top:10%}
body.ingame:not(.tv,.pad,.tvl) .cardfx .flip{width:min(78vw,300px,calc((100dvh - 40px) * 5 / 7))}
}
/* écran-TV qui est un téléphone tourné : le plateau prend toute la hauteur */
@media (orientation:landscape) and (max-height:500px){body.tv .scene{width:100%;height:calc(100dvh - 64px);aspect-ratio:auto}}
</style>

const QDATA = [
// ---------- LE CORAN ----------
["coran",1,"Combien de sourates compte le Coran ?","114",["110","99","120"],"Elles sont rangées à peu près de la plus longue à la plus courte, et non dans l'ordre de la révélation."],
["coran",1,"Quelle est la première sourate du Coran, dans l'ordre du mushaf ?","Al-Fâtiha",["Al-Baqara","Al-Ikhlâs","An-Nâs"],"« L'Ouverture » : on la récite à chaque rakʿa de la prière. Elle est aussi appelée « Umm al-Kitâb », la mère du Livre."],
["coran",1,"Quelle est la plus longue sourate du Coran ?","Al-Baqara",["Âl ʿImrân","An-Nisâ'","Yâ-Sîn"],"Elle compte 286 versets."],
["coran",1,"Dans quelle langue le Coran a-t-il été révélé ?","L'arabe",["L'araméen","L'hébreu","Le persan"],"Le Coran le dit lui-même : « Nous l'avons fait descendre, un Coran en arabe » (12:2)."],
["coran",1,"Quel ange a transmis la révélation au Prophète ﷺ ?","Jibrîl (Gabriel)",["Mîkâ'îl","Isrâfîl","Mâlik"],"Le Coran l'appelle aussi « l'Esprit fidèle » (ar-Rûh al-Amîn, 26:193)."],
["coran",1,"Dans quelle grotte a eu lieu la première révélation ?","La grotte de Hirâ'",["La grotte de Thawr","La grotte de Qubâ'","La grotte d'Uhud"],"La grotte de Thawr est celle où le Prophète ﷺ s'est caché avec Abû Bakr pendant l'Hégire."],
["coran",1,"Quel est le premier mot révélé du Coran ?","« Iqra' » (Lis !)",["« Bismillâh »","« Alhamdulillâh »","« Qul » (Dis !)"],"Début de la sourate Al-ʿAlaq (96)."],
["coran",1,"Quelle est la dernière sourate du Coran, dans l'ordre du mushaf ?","An-Nâs",["Al-Falaq","Al-Ikhlâs","Al-Kawthar"],"Avec Al-Falaq, ce sont les deux sourates de protection (al-muʿawwidhatân) que le Prophète ﷺ récitait avant de dormir (Bukhârî)."],
["coran",1,"Pendant quel mois la révélation du Coran a-t-elle commencé ?","Ramadan",["Muharram","Rajab","Dhû l-Hijja"],"« Le mois de Ramadan, au cours duquel le Coran a été descendu » (2:185)."],
["coran",1,"Quelle est la plus courte sourate du Coran ?","Al-Kawthar",["Al-Ikhlâs","An-Nasr","Al-ʿAsr"],"Elle compte 3 versets."],
["coran",1,"Quelle sourate porte le nom d'une femme ?","Maryam",["Âsiya","Khadîja","Fâtima"],"Sourate 19. Maryam est la seule femme nommée dans le Coran, plus de 30 fois."],
["coran",1,"Comment appelle-t-on une personne qui a mémorisé tout le Coran ?","Un hâfiz",["Un muezzin","Un mufti","Un calife"],"Le mot vient de « hafiza », garder, préserver. Des millions de musulmans, dont beaucoup d'enfants, connaissent le Coran par cœur."],
["coran",1,"Quelle sourate est la seule à ne pas commencer par « Bismillâh » ?","At-Tawba",["Al-Anfâl","Yûnus","Al-Fâtiha"],"Sourate 9. Une explication attribuée à ʿAlî : elle commence par une rupture de pacte, ce qui ne s'accorde pas avec la formule de miséricorde."],
["coran",2,"Pendant combien d'années environ le Coran a-t-il été révélé ?","Environ 23 ans",["Environ 10 ans","Environ 40 ans","Environ 5 ans"],"13 ans à La Mecque puis 10 ans à Médine, de 610 à 632."],
["coran",2,"Comment s'appelle la nuit où la révélation du Coran a commencé ?","Laylat al-Qadr (la Nuit du Destin)",["Laylat al-Isrâ'","La nuit de ʿÂchûrâ'","La nuit de l'Aïd"],"« Meilleure que mille mois » (97:3). On la cherche dans les nuits impaires des dix derniers jours du Ramadan."],
["coran",2,"Selon un hadith, quelle sourate équivaut au tiers du Coran ?","Al-Ikhlâs",["Al-Fâtiha","Yâ-Sîn","Al-Mulk"],"Rapporté par al-Bukhârî. En quatre versets, elle résume l'unicité d'Allah (le tawhîd)."],
["coran",2,"Quel verset est considéré comme le plus grand verset du Coran ?","Âyat al-Kursî (le verset du Trône)",["Le dernier verset d'Al-Baqara","Le premier verset d'Al-Fâtiha","Le verset de la lumière"],"Verset 255 de la sourate Al-Baqara."],
["coran",2,"Sous quel calife le Coran a-t-il été rassemblé pour la première fois en un seul recueil ?","Abû Bakr",["ʿUthmân","ʿUmar","ʿAlî"],"Sous ʿUthmân, des copies officielles ont ensuite été envoyées dans les provinces."],
["coran",2,"Sous quel calife des copies officielles du Coran ont-elles été envoyées dans les grandes villes ?","ʿUthmân",["Abû Bakr","ʿUmar","Muʿâwiya"],"Il fit faire ces copies à partir du recueil d'Abû Bakr, conservé chez Hafsa, pour unifier la lecture dans tout l'empire."],
["coran",2,"Quel compagnon a été chargé de rassembler le Coran ?","Zayd ibn Thâbit",["Bilâl ibn Rabâh","Abû Hurayra","Khâlid ibn al-Walîd"],"Jeune scribe de la révélation, il connaissait le Coran par cœur. Il a dit que déplacer une montagne lui aurait été plus facile (Bukhârî)."],
["coran",2,"En combien de parties (juz') le Coran est-il divisé ?","30",["60","114","7"],"Cette division permet de lire tout le Coran en un mois, un juz' par jour, par exemple pendant le Ramadan."],
["coran",2,"Que signifie « An-Nahl », le nom de la sourate 16 ?","Les abeilles",["Les fourmis","L'araignée","Le palmier"],"Le verset 69 évoque le miel qui sort de leur ventre, « une guérison pour les gens »."],
["coran",2,"Que signifie « Al-ʿAnkabût », le nom de la sourate 29 ?","L'araignée",["Les abeilles","L'éléphant","Les fourmis"],"Le verset 41 compare ceux qui prennent des protecteurs en dehors d'Allah à l'araignée : sa maison est la plus fragile des maisons."],
["coran",2,"Quelle sourate raconte l'histoire des jeunes gens de la caverne ?","Al-Kahf",["Yûsuf","Maryam","Tâ-Hâ"],"Sourate 18. Selon un hadith, la lire le vendredi est une lumière pour le croyant (Hâkim). Elle raconte aussi Mûsâ et al-Khadir."],
["coran",2,"Quelle sourate raconte en entier l'histoire d'un prophète, appelée « le plus beau des récits » ?","Yûsuf",["Ibrâhîm","Nûh","Hûd"],"« Nous te racontons le plus beau des récits » (12:3). C'est la seule sourate qui raconte toute la vie d'un prophète d'un bout à l'autre."],
["coran",2,"Comment appelle-t-on les sourates révélées avant l'Hégire ?","Les sourates mecquoises",["Les sourates médinoises","Les sourates longues","Les sourates abrogées"],"Elles parlent surtout de la foi : l'unicité d'Allah, le Jour dernier, les prophètes. Les médinoises abordent davantage les lois et la vie en communauté."],
["coran",2,"Dans quelle sourate revient le refrain « Lequel donc des bienfaits de votre Seigneur nierez-vous ? »","Ar-Rahmân",["Al-Wâqiʿa","Al-Mulk","Yâ-Sîn"],"Ce refrain revient 31 fois dans la sourate."],
["coran",3,"Quelle sourate contient le plus long verset du Coran ?","Al-Baqara",["An-Nisâ'","Âl ʿImrân","Al-Mâ'ida"],"Le verset 282, sur l'écriture des dettes."],
["coran",3,"Quel prophète est le plus souvent cité par son nom dans le Coran ?","Mûsâ (Moïse)",["Ibrâhîm","ʿÎsâ","Nûh"],"Il est cité environ 136 fois. Son histoire face à Pharaon revient dans de nombreuses sourates."],
["coran",3,"Combien de fois le nom « Muhammad » apparaît-il dans le Coran ?","4 fois",["1 fois","10 fois","25 fois"],"Il est aussi appelé « Ahmad » une fois, dans la sourate As-Saff."],
["coran",3,"Dans quelle sourate le Prophète ﷺ est-il appelé « Ahmad » ?","As-Saff",["Al-Ahzâb","Muhammad","Al-Fath"],"Verset 6 : ʿÎsâ annonce un messager après lui, « dont le nom sera Ahmad »."],
["coran",3,"Quel est le seul compagnon du Prophète ﷺ nommé dans le Coran ?","Zayd ibn Hâritha",["Abû Bakr","Bilâl","ʿAlî"],"Sourate Al-Ahzâb, verset 37."],
["coran",3,"Quelle sourate contient deux fois la formule « Bismillâh ar-Rahmân ar-Rahîm » ?","An-Naml",["Al-Fâtiha","At-Tawba","Al-Baqara"],"Au début et au verset 30, dans la lettre de Sulaymân."],
["coran",3,"Combien de sourates commencent par des lettres isolées (comme « Alif Lâm Mîm ») ?","29",["14","7","50"],"Comme Al-Baqara (Alif Lâm Mîm) ou Yâ-Sîn. Pour de nombreux savants, leur sens exact n'est connu que d'Allah."],
// ---------- LA VIE DU PROPHÈTE ----------
["sira",1,"Dans quelle ville est né le Prophète Muhammad ﷺ ?","La Mecque",["Médine","Taïf","Jérusalem"],"Vers l'an 570, dans le clan des Banû Hâchim, de la tribu de Quraych."],
["sira",1,"Comment s'appelait la mère du Prophète ﷺ ?","Âmina bint Wahb",["Halîma","Khadîja","Fâtima"],"Elle mourut quand il avait 6 ans, à al-Abwâ', sur la route de Médine."],
["sira",1,"Comment s'appelait le père du Prophète ﷺ ?","ʿAbdullâh",["Abû Tâlib","ʿAbd al-Muttalib","Hamza"],"Il est mort avant la naissance du Prophète ﷺ, qui est donc né orphelin de père."],
["sira",1,"Qui fut la première épouse du Prophète ﷺ ?","Khadîja",["ʿÂ'icha","Hafsa","Sawda"],"Riche commerçante, elle fut la première à croire en lui. Tant qu'elle vécut, il n'épousa aucune autre femme."],
["sira",1,"À quel âge le Prophète ﷺ a-t-il reçu la première révélation ?","40 ans",["25 ans","30 ans","63 ans"],"Dans la grotte de Hirâ', en 610, quand Jibrîl lui dit : « Lis ! »"],
["sira",1,"Vers quelle ville le Prophète ﷺ a-t-il émigré lors de l'Hégire ?","Médine (Yathrib)",["Jérusalem","Taïf","Damas"],"En 622. La ville s'appelait Yathrib ; elle devint « la ville du Prophète » (Madînat an-Nabî)."],
["sira",1,"Quel oncle a élevé et protégé le Prophète ﷺ ?","Abû Tâlib",["Abû Lahab","Hamza","al-ʿAbbâs"],"Il l'a protégé toute sa vie contre Quraych, sans pourtant embrasser l'islam."],
["sira",1,"À quel âge le Prophète ﷺ est-il décédé ?","63 ans",["60 ans","70 ans","53 ans"],"En l'an 11 de l'Hégire (632), à Médine, dans la chambre de ʿÂ'icha."],
["sira",1,"Quel compagnon accompagnait le Prophète ﷺ pendant l'Hégire ?","Abû Bakr",["ʿUmar","ʿAlî","Bilâl"],"ʿAlî était resté à La Mecque, dans le lit du Prophète ﷺ, pour tromper ses ennemis."],
["sira",1,"Quel surnom portait le Prophète ﷺ avant la prophétie, qui signifie « le digne de confiance » ?","Al-Amîn",["Al-Fârûq","As-Siddîq","Dhû n-Nûrayn"],"Même ses ennemis lui confiaient leurs biens. Lors de l'Hégire, il chargea ʿAlî de les rendre à leurs propriétaires."],
["sira",1,"Quelle nourrice a allaité le Prophète ﷺ dans le désert ?","Halîma as-Saʿdiyya",["Âmina","Umm Ayman","Khadîja"],"Il passa ses premières années chez elle, dans le désert des Banû Saʿd, où l'air et la langue arabe étaient plus purs."],
["sira",1,"Quelle fille du Prophète ﷺ a épousé ʿAlî ?","Fâtima",["Zaynab","Ruqayya","Umm Kulthûm"],"Mère d'al-Hasan et al-Husayn. Le Prophète ﷺ a dit : « Fâtima est une partie de moi » (Bukhârî)."],
["sira",1,"À quelle tribu appartenait le Prophète ﷺ ?","Quraych",["Thaqîf","Aws","Khazraj"],"La tribu gardienne de la Kaʿba. Une sourate porte son nom (sourate 106)."],
["sira",2,"Comment appelle-t-on l'année de naissance du Prophète ﷺ ?","L'année de l'Éléphant",["L'année de la tristesse","L'année de l'Hégire","L'année des délégations"],"L'année où Abraha voulut détruire la Kaʿba avec une armée d'éléphants, repoussée par des oiseaux (sourate 105)."],
["sira",2,"Quelle fut la première grande bataille des musulmans ?","Badr",["Uhud","Al-Khandaq","Hunayn"],"En l'an 2 de l'Hégire, pendant le Ramadan : environ 313 musulmans face à près de 1 000 Mecquois."],
["sira",2,"Lors de quelle bataille les musulmans ont-ils creusé une tranchée autour de Médine ?","Al-Khandaq (la bataille du Fossé)",["Badr","Uhud","Khaybar"],"En l'an 5 : une coalition d'environ 10 000 hommes assiégea Médine sans parvenir à franchir le fossé."],
["sira",2,"Quel compagnon a proposé de creuser la tranchée autour de Médine ?","Salmân al-Fârisî",["Abû Bakr","Khâlid ibn al-Walîd","Saʿd ibn Abî Waqqâs"],"C'était une technique perse, inconnue des Arabes. Le Prophète ﷺ creusa lui-même avec ses compagnons."],
["sira",2,"Comment s'appelle le voyage nocturne du Prophète ﷺ de La Mecque à Jérusalem ?","Al-Isrâ'",["Al-Hijra","Al-Fath","At-Tawâf"],"Il est suivi de l'ascension vers les cieux, al-Miʿrâj."],
["sira",2,"Quel traité a été conclu avec les Quraych en l'an 6 de l'Hégire ?","Le traité de Hudaybiyya",["Le traité de Médine","Le pacte de ʿAqaba","Le traité de Taïf"],"Il semblait défavorable aux musulmans, mais le Coran l'appelle « une victoire éclatante » (48:1). Il ouvrit la voie à la conquête de La Mecque."],
["sira",2,"En quelle année de l'Hégire La Mecque a-t-elle été conquise ?","L'an 8",["L'an 2","L'an 5","L'an 10"],"Le Prophète ﷺ y entra presque sans combat, pardonna à la plupart de ses anciens ennemis et fit détruire les idoles de la Kaʿba."],
["sira",2,"Quel oncle du Prophète ﷺ est surnommé « le lion d'Allah » ?","Hamza",["al-ʿAbbâs","Abû Tâlib","Abû Lahab"],"Il mourut en martyr à Uhud. Le Prophète ﷺ l'appela le « maître des martyrs » (Hâkim)."],
["sira",2,"Où est enterré le Prophète ﷺ ?","À Médine, dans la chambre de ʿÂ'icha",["À La Mecque","À Jérusalem","À Taïf"],"Les prophètes sont enterrés là où ils meurent. Cette chambre a été intégrée plus tard à l'agrandissement de la mosquée."],
["sira",2,"Dans quel pays des musulmans ont-ils trouvé refuge avant l'Hégire ?","L'Abyssinie (Éthiopie)",["L'Égypte","Le Yémen","La Perse"],"Ils y furent protégés par le roi chrétien, an-Najâchî."],
["sira",2,"Quelle fut la première mosquée construite par le Prophète ﷺ ?","La mosquée de Qubâ'",["La mosquée d'Al-Aqsâ","La mosquée du Prophète","La mosquée de ʿArafa"],"Construite à son arrivée à Médine. Selon le hadith, y prier équivaut à une ʿumra (Tirmidhî, Ibn Mâja)."],
["sira",2,"Comment s'appelle l'année où le Prophète ﷺ a perdu Khadîja et Abû Tâlib ?","L'année de la tristesse",["L'année de l'Éléphant","L'année de la victoire","L'année des délégations"],"Vers 619, trois ans avant l'Hégire."],
["sira",2,"Dans quelle ville le Prophète ﷺ a-t-il été rejeté et chassé à coups de pierres ?","Taïf",["Médine","Khaybar","Tabûk"],"Blessé, il refusa pourtant qu'ils soient punis, espérant que leurs descendants adorent Allah (Bukhârî, Muslim). Taïf embrassa l'islam plus tard."],
["sira",2,"Comment s'appelle le dernier pèlerinage du Prophète ﷺ, où il prononça un célèbre sermon ?","Le pèlerinage de l'adieu",["Le petit pèlerinage","Le pèlerinage de la victoire","Le pèlerinage de Hudaybiyya"],"En l'an 10. À ʿArafa, il rappela le caractère sacré de la vie et des biens, et l'égalité entre les gens."],
["sira",3,"À quel âge le Prophète ﷺ a-t-il perdu sa mère ?","6 ans",["2 ans","12 ans","25 ans"],"Sa mère Âmina mourut à al-Abwâ', au retour d'une visite à Médine."],
["sira",3,"Quel grand-père a pris en charge le Prophète ﷺ après la mort de sa mère ?","ʿAbd al-Muttalib",["Hâchim","Abû Tâlib","Wahb"],"Il mourut deux ans plus tard ; son oncle Abû Tâlib prit alors le relais."],
["sira",3,"Environ combien de musulmans ont combattu à Badr ?","Environ 313",["Environ 1 000","Environ 40","Environ 3 000"],"Le même nombre que les soldats de Tâlût qui traversèrent le fleuve avec lui, selon un compagnon (Bukhârî)."],
["sira",3,"Comment s'appelait le fils du Prophète ﷺ et de Mâriya, décédé en bas âge ?","Ibrâhîm",["Al-Qâsim","ʿAbdullâh","Zayd"],"Il mourut vers 18 mois. Une éclipse eut lieu ce jour-là ; le Prophète ﷺ précisa qu'elle n'avait rien à voir avec la mort de quelqu'un (Bukhârî)."],
["sira",3,"Quel est le nom de la chamelle du Prophète ﷺ lors de l'Hégire ?","Al-Qaswâ'",["Al-Burâq","Duldul","Sâlih"],"Al-Burâq est la monture du voyage nocturne."],
["sira",3,"Comment s'appelle le serment d'allégeance des Médinois, prêté près de La Mecque avant l'Hégire ?","Le serment de ʿAqaba",["Le serment de Ridwân","Le pacte de Hudaybiyya","Le serment de Badr"],"Deux serments, en 621 et 622, près de Mina. Ils préparèrent l'émigration vers Médine."],
["sira",3,"Quel compagnon a été le premier homme adulte libre à embrasser l'islam ?","Abû Bakr",["ʿUmar","ʿUthmân","Hamza"],"Khadîja fut la première personne à croire, et ʿAlî le premier enfant."],
// ---------- LES PROPHÈTES ----------
["prophetes",1,"Qui est le premier homme et le premier prophète ?","Âdam",["Nûh","Idrîs","Ibrâhîm"],"Allah lui apprit le nom de toutes choses (2:31) et ordonna aux anges de se prosterner devant lui."],
["prophetes",1,"Quel prophète a construit l'arche ?","Nûh (Noé)",["Ibrâhîm","Mûsâ","Yûnus"],"Seuls les croyants et des couples d'animaux furent sauvés du déluge. Son propre fils refusa de monter."],
["prophetes",1,"Quel prophète a été avalé par un grand poisson ?","Yûnus (Jonas)",["Yûsuf","Ayyûb","Mûsâ"],"Dans le ventre du poisson, il invoqua : « Lâ ilâha illâ anta, subhânaka, innî kuntu mina z-zâlimîn » (21:87)."],
["prophetes",1,"Quel prophète a construit la Kaʿba avec son fils Ismâʿîl ?","Ibrâhîm",["Âdam","Nûh","Dâwûd"],"En construisant, ils invoquaient : « Seigneur, accepte cela de notre part » (2:127)."],
["prophetes",1,"À quel prophète la Torah a-t-elle été révélée ?","Mûsâ (Moïse)",["ʿÎsâ","Dâwûd","Ibrâhîm"],"Elle lui fut donnée sur des tablettes, après sa rencontre avec Allah au mont Sinaï."],
["prophetes",1,"Quel prophète est né sans père ?","ʿÎsâ (Jésus)",["Yahyâ","Âdam","Ishâq"],"Âdam, lui, est né sans père ni mère."],
["prophetes",1,"Quel prophète a été jeté dans un puits par ses frères ?","Yûsuf (Joseph)",["Yûnus","Ismâʿîl","Hârûn"],"Jaloux de l'amour de leur père pour lui, ses frères le jetèrent dans un puits. Il devint plus tard ministre en Égypte."],
["prophetes",1,"Quel prophète comprenait le langage des animaux et commandait aux djinns ?","Sulaymân (Salomon)",["Dâwûd","Mûsâ","Sâlih"],"Il comprit même une fourmi qui avertissait les siennes, et sourit de ses paroles (27:18-19)."],
["prophetes",1,"Combien de prophètes sont cités par leur nom dans le Coran ?","25",["12","40","100"],"D'Âdam à Muhammad ﷺ, en passant par Nûh, Ibrâhîm, Mûsâ, ʿÎsâ… Il y a eu bien d'autres prophètes non cités."],
["prophetes",1,"Quel prophète a vaincu Jâlût (Goliath) ?","Dâwûd (David)",["Sulaymân","Mûsâ","Tâlût"],"Jeune soldat dans l'armée de Tâlût, il tua Jâlût. Allah lui donna ensuite la royauté et la sagesse (2:251)."],
["prophetes",1,"Quel livre a été révélé à Dâwûd ?","Les Psaumes (Az-Zabûr)",["La Torah","L'Évangile","Les Feuillets"],"Dâwûd avait une voix magnifique : les montagnes et les oiseaux glorifiaient Allah avec lui (34:10)."],
["prophetes",1,"Quel livre a été révélé à ʿÎsâ ?","L'Évangile (Al-Injîl)",["La Torah","Les Psaumes","Le Coran"],"Selon le Coran, ʿÎsâ vint confirmer la Torah et annoncer un messager après lui (61:6)."],
["prophetes",1,"Comment s'appelle la mère de ʿÎsâ ?","Maryam",["Âsiya","Hâjar","Sâra"],"Fille de ʿImrân, elle fut confiée à Zakariyyâ et consacrée au culte d'Allah. Une sourate entière porte son nom."],
["prophetes",2,"Quel prophète est surnommé « Khalîl Allâh », l'ami intime d'Allah ?","Ibrâhîm",["Mûsâ","Nûh","ʿÎsâ"],"« Et Allah a pris Ibrâhîm pour ami intime » (4:125)."],
["prophetes",2,"Quel prophète est surnommé « Kalîm Allâh », celui à qui Allah a parlé directement ?","Mûsâ",["Ibrâhîm","Âdam","Yûsuf"],"« Et Allah a parlé à Mûsâ de vive voix » (4:164)."],
["prophetes",2,"Quel prophète a été éprouvé par une longue maladie et est resté patient ?","Ayyûb (Job)",["Yaʿqûb","Yûnus","Zakariyyâ"],"Il perdit santé, biens et enfants sans se plaindre à autre qu'Allah, qui lui rendit tout au double (21:83-84)."],
["prophetes",2,"Quel prophète a été envoyé au peuple de ʿÂd ?","Hûd",["Sâlih","Chuʿayb","Lût"],"Un peuple puissant et bâtisseur, détruit par un vent glacial pendant 7 nuits et 8 jours (69:6-7)."],
["prophetes",2,"Quel prophète a été envoyé au peuple de Thamûd, avec une chamelle comme signe ?","Sâlih",["Hûd","Chuʿayb","Nûh"],"Ils tuèrent la chamelle malgré l'avertissement, et un cri terrible les anéantit."],
["prophetes",2,"Quel prophète a été envoyé au peuple de Madyan ?","Chuʿayb",["Hûd","Sâlih","Lût"],"Il appela son peuple à ne plus tricher sur les mesures et les poids dans le commerce."],
["prophetes",2,"Quel prophète est le père de Yahyâ (Jean-Baptiste) ?","Zakariyyâ",["ʿImrân","Yaʿqûb","Dâwûd"],"Très âgé, avec une femme stérile, il invoqua Allah qui lui donna Yahyâ."],
["prophetes",2,"Pour quel prophète le feu est-il devenu fraîcheur et paix ?","Ibrâhîm",["Mûsâ","Yûsuf","Nûh"],"« Ô feu, sois fraîcheur et paix pour Ibrâhîm » (21:69), après qu'il eut brisé les idoles de son peuple."],
["prophetes",2,"Quel prophète a interprété le rêve du roi d'Égypte sur les sept vaches grasses ?","Yûsuf",["Mûsâ","Dâniyâl","Sulaymân"],"Il annonça 7 années d'abondance puis 7 de famine, ce qui permit à l'Égypte de faire des réserves."],
["prophetes",2,"Quel frère a aidé Mûsâ dans sa mission ?","Hârûn (Aaron)",["Yûsuf","Ismâʿîl","Yûchaʿ"],"Mûsâ avait demandé à Allah de lui donner son frère pour l'aider, car Hârûn parlait avec plus d'aisance (28:34)."],
["prophetes",2,"Quel prophète a grandi dans le palais de Pharaon ?","Mûsâ",["Yûsuf","Hârûn","Ibrâhîm"],"Sa mère le mit dans un coffre sur le Nil ; il fut recueilli par la femme de Pharaon."],
["prophetes",2,"Quel prophète est le fils de Dâwûd ?","Sulaymân",["Yahyâ","Ishâq","Yûnus"],"Il hérita de la prophétie et de la royauté de son père (27:16)."],
["prophetes",2,"Quel prophète est le père de Yûsuf ?","Yaʿqûb (Jacob)",["Ishâq","Ibrâhîm","Ismâʿîl"],"Aussi appelé Isrâ'îl. Il perdit la vue de chagrin pour Yûsuf et la retrouva grâce à sa chemise (12:93-96)."],
["prophetes",3,"Pendant combien d'années Nûh a-t-il appelé son peuple, selon le Coran ?","950 ans",["40 ans","100 ans","300 ans"],"Sourate Al-ʿAnkabût, verset 14."],
["prophetes",3,"Quel nom le Coran donne-t-il au père d'Ibrâhîm ?","Âzar",["Târikh","Namrûd","ʿImrân"],"Ibrâhîm l'appela avec douceur à abandonner les idoles, sans succès (19:42-47)."],
["prophetes",3,"Quel prophète est appelé « Dhû n-Nûn », l'homme au poisson ?","Yûnus",["Nûh","Mûsâ","Ilyâs"],"« Nûn » veut dire poisson en arabe. Le Coran l'appelle aussi « le compagnon du poisson » (68:48)."],
["prophetes",3,"Lequel de ces prophètes ne fait PAS partie des « Ulû l-ʿAzm » (les prophètes doués de résolution) ?","Yûsuf",["Nûh","Ibrâhîm","Mûsâ"],"Les cinq sont Nûh, Ibrâhîm, Mûsâ, ʿÎsâ et Muhammad ﷺ."],
["prophetes",3,"À quel prophète, avec Mûsâ, des « Feuillets » (Suhuf) ont-ils été révélés ?","Ibrâhîm",["Nûh","Dâwûd","Âdam"],"Sourate Al-Aʿlâ, verset 19."],
["prophetes",3,"Quel prophète est le fils d'Ibrâhîm et de Sâra ?","Ishâq (Isaac)",["Ismâʿîl","Yaʿqûb","Lût"],"Les anges annoncèrent sa naissance à Sâra, très âgée, qui en rit d'étonnement (11:71-72)."],
["prophetes",3,"Comment s'appelle, selon la tradition, l'épouse croyante de Pharaon ?","Âsiya",["Hâjar","Balqîs","Zulaykha"],"Le Coran la cite en exemple de foi face à Pharaon (66:11), et le Prophète ﷺ l'a comptée parmi les femmes parfaites (Bukhârî)."],
["prophetes",3,"À quel prophète était lié le peuple de Sodome ?","Lût (Loth)",["Hûd","Chuʿayb","Sâlih"],"Son peuple fut détruit pour ses mauvaises actions ; sa propre femme fut parmi les perdants."],
// ---------- PILIERS ET PRATIQUE ----------
["piliers",1,"Combien y a-t-il de piliers de l'islam ?","5",["3","6","7"],"La chahâda, la prière, la zakât, le jeûne du Ramadan et le pèlerinage (hadith de Jibrîl, Muslim)."],
["piliers",1,"Quel est le premier pilier de l'islam ?","La chahâda (l'attestation de foi)",["La prière","Le jeûne","Le pèlerinage"],"« Lâ ilâha illâ Llâh, Muhammadun rasûlu Llâh » : nul ne mérite d'être adoré sauf Allah, et Muhammad est Son messager."],
["piliers",1,"Combien de prières obligatoires y a-t-il par jour ?","5",["3","7","2"],"Fajr, Dhuhr, ʿAsr, Maghrib et ʿIchâ'. Elles furent prescrites lors du Miʿrâj."],
["piliers",1,"Comment s'appelle l'aumône obligatoire ?","La zakât",["La sadaqa","Le waqf","La jizya"],"La sadaqa est l'aumône volontaire."],
["piliers",1,"Vers quoi les musulmans se tournent-ils pour prier ?","La Kaʿba, à La Mecque",["Jérusalem","Médine","Le soleil levant"],"On priait d'abord vers Jérusalem. La qibla fut tournée vers la Kaʿba environ 16 mois après l'Hégire (2:144)."],
["piliers",1,"Comment s'appelle l'appel à la prière ?","L'adhân",["L'iqâma","Le takbîr","La khutba"],"Il fut institué à Médine après le rêve d'ʿAbdullâh ibn Zayd ; Bilâl fut choisi pour sa belle voix (Abû Dâwûd)."],
["piliers",1,"Comment s'appelle la purification faite avant la prière ?","Les ablutions (al-wudû')",["Le tayammum","L'ihrâm","Le tawâf"],"Se laver le visage, les mains jusqu'aux coudes, passer les mains sur la tête et laver les pieds (5:6)."],
["piliers",1,"Combien y a-t-il de piliers de la foi (arkân al-îmân) ?","6",["5","4","7"],"Croire en Allah, Ses anges, Ses livres, Ses messagers, le Jour dernier et le destin (hadith de Jibrîl, Muslim)."],
["piliers",1,"Quelle fête marque la fin du Ramadan ?","L'Aïd al-Fitr",["L'Aïd al-Adhâ","ʿÂchûrâ'","Le Mawlid"],"Le 1er Chawwâl. Il est interdit de jeûner ce jour-là."],
["piliers",1,"Quelle fête est aussi appelée « la fête du sacrifice » ?","L'Aïd al-Adhâ",["L'Aïd al-Fitr","Laylat al-Qadr","Le jour de ʿArafa"],"Le 10 Dhû l-Hijja. Elle rappelle le sacrifice d'Ibrâhîm."],
["piliers",1,"Comment s'appelle la prière de l'aube ?","Al-Fajr (As-Subh)",["Al-ʿAsr","Al-Maghrib","Al-ʿIchâ'"],"Les 2 rakʿa de sunna avant le Fajr valent mieux que ce bas monde et ce qu'il contient (Muslim)."],
["piliers",2,"Combien de rakʿa compte la prière du Maghrib ?","3",["2","4","5"],"C'est la seule prière obligatoire de 3 rakʿa, et elle ne se raccourcit pas en voyage."],
["piliers",2,"Combien de rakʿa compte la prière du Fajr ?","2",["3","4","1"],"La plus courte, mais l'une des plus lourdes pour l'hypocrite, selon le hadith (Bukhârî, Muslim)."],
["piliers",2,"Combien de rakʿa compte la prière du Dhuhr ?","4",["2","3","5"],"Le vendredi, elle est remplacée par la prière du Jumuʿa : 2 rakʿa précédées d'un sermon."],
["piliers",2,"Comment s'appelle la circumambulation autour de la Kaʿba ?","Le tawâf",["Le saʿy","L'ihrâm","Le wuqûf"],"On le commence à l'angle de la Pierre noire, en gardant la Kaʿba à sa gauche."],
["piliers",2,"Combien de tours fait-on autour de la Kaʿba lors du tawâf ?","7",["3","5","10"],"Lors du tawâf d'arrivée, les hommes font les trois premiers tours d'un pas rapide (ar-raml)."],
["piliers",2,"Entre quelles collines les pèlerins font-ils des allers-retours (le saʿy) ?","Safâ et Marwa",["ʿArafa et Muzdalifa","Uhud et Thawr","Hirâ' et Mina"],"En souvenir de Hâjar, qui courut entre les deux collines pour chercher de l'eau pour Ismâʿîl, avant que jaillisse Zamzam (Bukhârî)."],
["piliers",2,"Quel est le jour le plus important du Hajj, où les pèlerins se tiennent debout en invocation ?","Le jour de ʿArafa",["Le jour de l'Aïd","Le jour de Mina","Le premier jour du tawâf"],"« Le Hajj, c'est ʿArafa » (Tirmidhî). C'est le meilleur jour pour invoquer Allah."],
["piliers",2,"Quel est le taux habituel de la zakât sur l'argent épargné pendant un an ?","2,5 %",["10 %","5 %","20 %"],"Soit un quarantième de l'argent qui atteint le seuil (nisâb) et reste en possession pendant un an lunaire."],
["piliers",2,"Comment s'appelle le repas pris avant l'aube pendant le Ramadan ?","Le suhûr",["L'iftâr","Le ftour","La walîma"],"L'iftâr est le repas de rupture du jeûne, au coucher du soleil."],
["piliers",2,"Comment s'appelle l'aumône donnée avant la prière de l'Aïd al-Fitr ?","Zakât al-Fitr",["La jizya","Le waqf","La kaffâra"],"Environ 2,5 kg de nourriture de base par personne, pour que les pauvres puissent aussi fêter l'Aïd."],
["piliers",2,"Comment s'appelle la purification faite sans eau, avec de la terre propre ?","Le tayammum",["Le wudû'","Le ghusl","L'istinjâ'"],"Quand l'eau manque ou qu'on ne peut pas l'utiliser, par exemple à cause d'une maladie (5:6)."],
["piliers",2,"Comment s'appelle l'état de sacralisation du pèlerin ?","L'ihrâm",["Le tawâf","Le saʿy","Le taqsîr"],"Les hommes portent deux pièces de tissu blanc non cousu : tous sont égaux devant Allah."],
["piliers",2,"Lequel de ces éléments ne fait PAS partie des six piliers de la foi ?","Le pèlerinage",["La croyance aux anges","La croyance aux livres révélés","La croyance au destin"],"Les six : Allah, les anges, les livres, les messagers, le Jour dernier et le destin."],
["piliers",2,"Comment s'appelle la source d'eau bénie située près de la Kaʿba ?","Zamzam",["Salsabîl","Kawthar","Tasnîm"],"Elle jaillit pour Hâjar et Ismâʿîl. « L'eau de Zamzam est pour ce pour quoi on la boit » (Ibn Mâja)."],
["piliers",2,"Comment s'appelle le pèlerinage mineur, possible toute l'année ?","La ʿumra",["Le hajj","La ziyâra","Le ribât"],"Elle comprend l'ihrâm, le tawâf, le saʿy, puis on se rase ou on se coupe les cheveux."],
["piliers",3,"Comment s'appellent les prières surérogatoires de la nuit pendant le Ramadan ?","Les tarâwîh",["Le witr","Le duhâ","Le qunût"],"Le Prophète ﷺ les pria quelques nuits en groupe, puis s'arrêta de peur qu'elles deviennent obligatoires (Bukhârî)."],
["piliers",3,"Pendant quel mois du calendrier hégirien a lieu le Hajj ?","Dhû l-Hijja",["Ramadan","Chawwâl","Muharram"],"Le 12e et dernier mois. Ses dix premiers jours sont les meilleurs jours de l'année (Bukhârî)."],
["piliers",3,"Comment s'appelle la retraite spirituelle à la mosquée pendant les dix derniers jours du Ramadan ?","L'iʿtikâf",["Le ribât","La khalwa","Le tahajjud"],"Le Prophète ﷺ le faisait chaque année pendant les dix derniers jours du Ramadan (Bukhârî, Muslim)."],
["piliers",3,"Quelle prière se fait debout, sans inclinaison ni prosternation ?","La prière funéraire (salât al-janâza)",["La prière du vendredi","La prière de l'Aïd","La prière du witr"],"Elle compte 4 takbîr. Y assister jusqu'à l'enterrement rapporte deux grandes récompenses, « grandes comme deux montagnes » (Bukhârî, Muslim)."],
["piliers",3,"Comment appelle-t-on le seuil minimum de richesse à partir duquel la zakât est due ?","Le nisâb",["Le hawl","Le mahr","Le fidya"],"Le hawl est la durée d'un an lunaire pendant laquelle la richesse doit être possédée."],
["piliers",3,"Dans quel lieu les pèlerins passent-ils la nuit après ʿArafa ?","Muzdalifa",["Mina","Qubâ'","Tabûk"],"Les pèlerins y ramassent souvent les cailloux pour la lapidation à Mina."],
["piliers",3,"Combien de petits cailloux lance-t-on sur la stèle de ʿAqaba le jour du sacrifice ?","7",["3","21","49"],"Les jours suivants, on lance 7 cailloux sur chacune des trois stèles de Mina."],
// ---------- HISTOIRE DE L'ISLAM ----------
["histoire",1,"Qui fut le premier calife après le Prophète ﷺ ?","Abû Bakr",["ʿUmar","ʿUthmân","ʿAlî"],"Il gouverna un peu plus de deux ans (632-634) et fit rassembler le Coran."],
["histoire",1,"Qui fut le deuxième calife ?","ʿUmar ibn al-Khattâb",["Abû Bakr","ʿUthmân","Muʿâwiya"],"Califat de 10 ans (634-644), pendant lequel l'islam s'étendit à la Perse, la Syrie et l'Égypte."],
["histoire",1,"Qui fut le troisième calife ?","ʿUthmân ibn ʿAffân",["ʿAlî","ʿUmar","Abû Bakr"],"Califat de 12 ans (644-656). Il fut assassiné chez lui alors qu'il lisait le Coran."],
["histoire",1,"Qui fut le quatrième calife ?","ʿAlî ibn Abî Tâlib",["ʿUthmân","Hasan","Muʿâwiya"],"Califat de 656 à 661. Il fut le premier enfant à croire au Prophète ﷺ."],
["histoire",1,"En quelle année de notre calendrier a eu lieu l'Hégire ?","622",["570","610","632"],"C'est l'an 1 du calendrier hégirien, choisi plus tard par ʿUmar."],
["histoire",1,"Comment appelle-t-on les quatre premiers califes ?","Les califes « bien guidés » (ar-Râchidûn)",["Les Omeyyades","Les Abbassides","Les Ottomans"],"« Attachez-vous à ma sunna et à celle des califes bien guidés » (Abû Dâwûd, Tirmidhî)."],
["histoire",1,"Quelle ville est la troisième ville sainte de l'islam ?","Jérusalem (Al-Quds)",["Damas","Le Caire","Bagdad"],"C'était la première qibla et le lieu du voyage nocturne."],
["histoire",1,"Quelle célèbre mosquée se trouve à Jérusalem ?","Al-Aqsâ",["Al-Azhar","La mosquée des Omeyyades","La mosquée de Qubâ'"],"« La mosquée la plus lointaine » (17:1), destination du voyage nocturne du Prophète ﷺ."],
["histoire",2,"Quel calife a instauré le calendrier hégirien ?","ʿUmar",["Abû Bakr","ʿUthmân","ʿAlî"],"Vers 638, il choisit l'Hégire comme point de départ, sur proposition de ʿAlî."],
["histoire",2,"Sous quel calife Jérusalem est-elle entrée dans l'islam ?","ʿUmar",["Abû Bakr","ʿAlî","Hârûn ar-Rachîd"],"Vers 638, ʿUmar vint en personne recevoir la ville et garantit la sécurité de ses habitants."],
["histoire",2,"Quelle dynastie a succédé aux califes bien guidés ?","Les Omeyyades",["Les Abbassides","Les Fatimides","Les Ottomans"],"Fondée par Muʿâwiya en 661, la dynastie régna jusqu'en 750."],
["histoire",2,"Quelle était la capitale des Omeyyades ?","Damas",["Bagdad","Le Caire","Cordoue"],"La grande mosquée des Omeyyades y fut construite sous le calife al-Walîd Ier."],
["histoire",2,"Quelle ville les Abbassides ont-ils fondée comme capitale ?","Bagdad",["Damas","Médine","Samarcande"],"Fondée en 762 par le calife al-Mansûr, en forme de cercle : on l'appelait « la ville ronde »."],
["histoire",2,"Comment s'appelait le grand centre de savoir et de traduction de Bagdad ?","La Maison de la sagesse (Bayt al-Hikma)",["Al-Azhar","Al-Qarawiyyîn","L'Alhambra"],"Des savants y traduisaient en arabe les livres grecs, perses et indiens de science et de philosophie."],
["histoire",2,"Quel chef musulman a repris Jérusalem aux croisés en 1187 ?","Salâh ad-Dîn (Saladin)",["Târiq ibn Ziyâd","Mehmed II","Nûr ad-Dîn"],"Il épargna les habitants, à l'inverse du massacre commis par les croisés en 1099."],
["histoire",2,"Comment appelait-on l'Espagne musulmane ?","Al-Andalus",["Al-Maghrib","Ifrîqiya","Châm"],"La présence musulmane y dura de 711 à 1492, près de huit siècles."],
["histoire",2,"Quelle ville d'Al-Andalus est célèbre pour sa grande mosquée ?","Cordoue",["Madrid","Barcelone","Valence"],"Capitale du califat omeyyade d'Espagne, c'était l'une des plus grandes villes d'Europe au Xe siècle."],
["histoire",2,"Quel empire musulman a conquis Constantinople en 1453 ?","L'Empire ottoman",["Les Abbassides","Les Mamelouks","Les Moghols"],"La ville prit le nom d'Istanbul et resta la capitale de l'empire jusqu'en 1922."],
["histoire",2,"Quel savant musulman a donné son nom à « l'algorithme » et est un père de l'algèbre ?","Al-Khwârizmî",["Ibn Sînâ","Ibn Khaldûn","Al-Bîrûnî"],"Le mot « algèbre » vient du titre de son livre : « al-jabr »."],
["histoire",2,"Quel médecin a écrit le célèbre « Canon de la médecine » ?","Ibn Sînâ (Avicenne)",["Ibn Rochd (Averroès)","Ar-Râzî","Ibn Battûta"],"Son Canon fut enseigné dans les universités d'Europe pendant plusieurs siècles."],
["histoire",2,"Quel voyageur marocain a parcouru une grande partie du monde au XIVe siècle ?","Ibn Battûta",["Ibn Khaldûn","Al-Idrîsî","Ibn Jubayr"],"Parti de Tanger en 1325, il voyagea près de 30 ans, jusqu'en Chine."],
["histoire",3,"Quel penseur a écrit la « Muqaddima », souvent vue comme un texte fondateur de la sociologie ?","Ibn Khaldûn",["Al-Ghazâlî","Ibn Rochd","Al-Fârâbî"],"Né à Tunis en 1332, il y analyse l'essor et le déclin des civilisations."],
["histoire",3,"Quel général a traversé le détroit vers l'Espagne en 711 ?","Târiq ibn Ziyâd",["Mûsâ ibn Nusayr","ʿUqba ibn Nâfiʿ","Khâlid ibn al-Walîd"],"Le nom « Gibraltar » vient de « Jabal Târiq », la montagne de Târiq."],
["histoire",3,"Quelle université de Fès, fondée par une femme, Fâtima al-Fihriyya, est l'une des plus anciennes au monde encore en activité ?","Al-Qarawiyyîn",["Al-Azhar","Az-Zaytûna","Nizâmiyya"],"Fondée en 859 grâce à l'héritage de Fâtima al-Fihriyya."],
["histoire",3,"Quel célèbre palais se trouve à Grenade ?","L'Alhambra",["Topkapı","Le Taj Mahal","L'Alcazar de Tolède"],"Palais des Nasrides, dernière dynastie musulmane d'Espagne, célèbre pour ses jardins et ses arabesques."],
["histoire",3,"En quelle année Grenade, dernier royaume d'Al-Andalus, est-elle tombée ?","1492",["1187","1453","1258"],"Le roi Boabdil remit la ville aux Rois catholiques, l'année même du voyage de Christophe Colomb."],
["histoire",3,"Quelle ville a été fondée par les Fatimides en 969 ?","Le Caire",["Bagdad","Kairouan","Fès"],"Ils y fondèrent aussi la mosquée al-Azhar, devenue plus tard une grande université sunnite."],
["histoire",3,"Quel savant est considéré comme le père de l'optique moderne ?","Ibn al-Haytham (Alhazen)",["Al-Khwârizmî","Ibn Sînâ","Jâbir ibn Hayyân"],"Il montra que la vision vient de la lumière qui entre dans l'œil, et non de rayons qui en sortent."],
["histoire",3,"Quel sultan ottoman a conquis Constantinople ?","Mehmed II (al-Fâtih)",["Soliman le Magnifique","Selim Ier","Osman Ier"],"Il avait 21 ans. Un hadith annonçant cette conquête est souvent cité, mais son authenticité est discutée."],
["histoire",3,"En quelle année Bagdad a-t-elle été détruite par les Mongols ?","1258",["1099","1492","1453"],"Les Mongols tuèrent le calife abbasside et jetèrent tant de livres dans le Tigre que l'eau, dit-on, devint noire d'encre."],
// ---------- COMPAGNONS ET CULTURE ----------
["culture",1,"Que signifie le mot « islam » ?","La soumission (à Dieu)",["La prière","La communauté","Le voyage"],"Le mot vient de la même racine que « salâm », la paix."],
["culture",1,"Quel est le premier mois du calendrier hégirien ?","Muharram",["Ramadan","Chawwâl","Rajab"],"C'est l'un des quatre mois sacrés. Il est recommandé d'y jeûner le jour de ʿÂchûrâ', le 10."],
["culture",1,"Que signifie « Alhamdulillâh » ?","Louange à Dieu",["Dieu est le plus grand","Si Dieu le veut","Au nom de Dieu"],"« Alhamdulillâh » remplit la balance des bonnes actions (Muslim)."],
["culture",1,"Que signifie « Inchâ'Allâh » ?","Si Dieu le veut",["Louange à Dieu","Dieu est le plus grand","Gloire à Dieu"],"On l'ajoute quand on parle d'une action future (18:23-24)."],
["culture",1,"Comment appelle-t-on l'ensemble des paroles, actes et approbations du Prophète ﷺ ?","La Sunna",["La charia","Le fiqh","La sîra"],"Avec le Coran, c'est la deuxième source de l'islam."],
["culture",1,"Quel compagnon fut le premier muezzin de l'islam ?","Bilâl ibn Rabâh",["Abû Hurayra","Salmân al-Fârisî","Zayd ibn Thâbit"],"Ancien esclave torturé pour sa foi, il répétait « Ahad, Ahad » (Un, Un). Abû Bakr l'acheta pour l'affranchir."],
["culture",1,"Quel compagnon est surnommé « As-Siddîq », le véridique ?","Abû Bakr",["ʿUmar","ʿUthmân","ʿAlî"],"Il crut aussitôt au récit du voyage nocturne quand d'autres en doutaient : « S'il l'a dit, alors c'est vrai. »"],
["culture",1,"Quel compagnon est surnommé « Al-Fârûq », celui qui distingue le vrai du faux ?","ʿUmar",["Abû Bakr","ʿAlî","Hamza"],"Sa conversion donna de la force aux musulmans, qui purent prier ouvertement près de la Kaʿba."],
["culture",1,"Combien de mois compte le calendrier hégirien ?","12",["10","13","11"],"« Le nombre des mois auprès d'Allah est de douze » (9:36)."],
["culture",1,"Qui était le cousin et le gendre du Prophète ﷺ ?","ʿAlî ibn Abî Tâlib",["ʿUthmân","Abû Bakr","Zayd"],"Fils d'Abû Tâlib, il épousa Fâtima, la fille du Prophète ﷺ."],
["culture",2,"Quel calife est surnommé « Dhû n-Nûrayn » parce qu'il a épousé deux filles du Prophète ﷺ ?","ʿUthmân",["ʿAlî","ʿUmar","Abû Bakr"],"Il épousa Ruqayya puis, après son décès, Umm Kulthûm."],
["culture",2,"Quel compagnon a rapporté le plus grand nombre de hadiths ?","Abû Hurayra",["Ibn ʿAbbâs","Anas ibn Mâlik","Muʿâdh ibn Jabal"],"Plus de 5 000 hadiths. Son surnom signifie « le père du petit chat »."],
["culture",2,"Quelle épouse du Prophète ﷺ est célèbre pour sa grande science et a rapporté de nombreux hadiths ?","ʿÂ'icha",["Sawda","Maymûna","Zaynab"],"Fille d'Abû Bakr, elle a rapporté plus de 2 000 hadiths, et les grands compagnons venaient la consulter."],
["culture",2,"Quel compagnon est surnommé « l'épée d'Allah » ?","Khâlid ibn al-Walîd",["Hamza","ʿAlî","ʿAmr ibn al-ʿÂs"],"Le Prophète ﷺ lui donna ce surnom lors de la bataille de Mu'ta (Bukhârî)."],
["culture",2,"Quel compagnon venait de Perse ?","Salmân al-Fârisî",["Bilâl","Suhayb ar-Rûmî","Abû Dharr"],"Bilâl venait d'Abyssinie et Suhayb avait grandi chez les Byzantins (Rûm)."],
["culture",2,"Quels sont les deux recueils de hadiths considérés comme les plus authentiques ?","Sahîh al-Bukhârî et Sahîh Muslim",["Le Muwatta' et le Musnad","Les Sunan d'Abû Dâwûd et d'At-Tirmidhî","Riyâd as-Sâlihîn et Al-Arbaʿîn"],"Al-Bukhârî a choisi ses hadiths parmi des centaines de milliers, avec des conditions très strictes."],
["culture",2,"Qui fut la première martyre de l'islam ?","Sumayya",["Khadîja","Nusayba","Asmâ'"],"Mère de ʿAmmâr ibn Yâsir, elle fut tuée par Abû Jahl pour avoir refusé de renier sa foi."],
["culture",2,"Quel est le rang de Ramadan dans le calendrier hégirien ?","Le 9e mois",["Le 1er mois","Le 7e mois","Le 12e mois"],"Le jeûne de ce mois est l'un des cinq piliers de l'islam."],
["culture",2,"Que signifie « Hijra » ?","L'émigration",["La victoire","La prière","Le pèlerinage"],"Ceux qui ont émigré à Médine sont appelés les Muhâjirûn, et ceux qui les ont accueillis les Ansâr."],
["culture",2,"Quel jour est ʿÂchûrâ' ?","Le 10 Muharram",["Le 27 Ramadan","Le 1er Chawwâl","Le 10 Dhû l-Hijja"],"Jour où Allah sauva Mûsâ de Pharaon. Le Prophète ﷺ le jeûnait et voulut y ajouter le 9 (Muslim)."],
["culture",2,"Lequel de ces savants n'a PAS fondé d'école juridique sunnite ?","Al-Bukhârî",["Abû Hanîfa","Mâlik ibn Anas","Ach-Châfiʿî"],"Les quatre écoles : hanafite, malikite, chafiite et hanbalite."],
["culture",2,"Quelle école juridique est majoritaire au Maroc ?","L'école malikite",["L'école hanafite","L'école chafiite","L'école hanbalite"],"Comme dans tout le Maghreb et une grande partie de l'Afrique de l'Ouest. Elle porte le nom de l'imam Mâlik, de Médine."],
["culture",3,"Combien de compagnons ont été promis au Paradis dans un même hadith ?","10",["4","7","40"],"Abû Bakr, ʿUmar, ʿUthmân, ʿAlî, Talha, az-Zubayr, ʿAbd ar-Rahmân ibn ʿAwf, Saʿd ibn Abî Waqqâs, Saʿîd ibn Zayd et Abû ʿUbayda (Tirmidhî)."],
["culture",3,"Quelle épouse du Prophète ﷺ était la fille de ʿUmar ?","Hafsa",["ʿÂ'icha","Umm Salama","Zaynab"],"C'est chez elle qu'était conservé le recueil du Coran réalisé sous Abû Bakr."],
["culture",3,"Quel compagnon était surnommé « l'homme de confiance de cette communauté » ?","Abû ʿUbayda ibn al-Jarrâh",["Abû Bakr","Muʿâdh ibn Jabal","Saʿd ibn Abî Waqqâs"],"Rapporté par al-Bukhârî et Muslim. Il fait partie des dix promis au Paradis."],
["culture",3,"Quel jeune compagnon le Prophète ﷺ a-t-il nommé à la tête d'une armée juste avant sa mort ?","Usâma ibn Zayd",["ʿAbdullâh ibn ʿUmar","Anas ibn Mâlik","Muʿâdh ibn Jabal"],"Il avait environ 18 ans. Après la mort du Prophète ﷺ, Abû Bakr envoya quand même l'armée, comme prévu."],
["culture",3,"Quel titre portent les épouses du Prophète ﷺ ?","Mères des croyants (Ummahât al-Mu'minîn)",["Filles de l'islam","Dames du Paradis","Sœurs des croyants"],"« Ses épouses sont leurs mères » (33:6), en signe de respect."],
["culture",3,"Quelle école juridique est majoritaire en Turquie ?","L'école hanafite",["L'école malikite","L'école chafiite","L'école hanbalite"],"C'était l'école officielle de l'Empire ottoman. Elle porte le nom de l'imam Abû Hanîfa."],
["culture",3,"Quel imam est l'auteur du « Muwatta' », l'un des plus anciens recueils de hadiths ?","L'imam Mâlik",["L'imam al-Bukhârî","L'imam Ahmad","L'imam an-Nawawî"],"« Le chemin aplani ». L'imam Mâlik vivait à Médine, la ville du Prophète ﷺ."],
["adab",1,"Tu éternues. Que dis-tu ?","Alhamdulillâh",["Bismillâh","Astaghfirullâh","Subhânallâh"],"Le Prophète ﷺ a dit qu'Allah aime l'éternuement et déteste le bâillement (Bukhârî)."],
["adab",1,"Quelqu'un éternue et dit « Alhamdulillâh ». Que lui réponds-tu ?","« Yarhamuka Llâh » (qu'Allah te fasse miséricorde)",["« Bârak Allâhu fîk »", "« Mâ châ' Allâh »", "« Inchâ'Allâh »"],"Il te répond ensuite : « Yahdîkumu Llâh wa yuslihu bâlakum » (qu'Allah vous guide et améliore votre état)."],
["adab",1,"Quelqu'un te dit « As-salâmu ʿalaykum ». Que réponds-tu ?","« Wa ʿalaykumu s-salâm »",["« Bismillâh »","« Alhamdulillâh »","« Allâhu akbar »"],"Répondre au salam est obligatoire ; le donner en premier est recommandé."],
["adab",1,"Que dis-tu avant de commencer à manger ?","Bismillâh",["Alhamdulillâh","Allâhu akbar","Astaghfirullâh"],"Le Prophète ﷺ a dit à un enfant : « Dis Bismillâh, mange de ta main droite et de ce qui est devant toi » (Bukhârî, Muslim)."],
["adab",1,"Avec quelle main le Prophète ﷺ recommandait-il de manger et de boire ?","La main droite",["La main gauche","Les deux mains","Peu importe"],"Selon le hadith, Satan mange et boit de la main gauche (Muslim)."],
["adab",1,"Que dis-tu quand tu as fini de manger ?","Alhamdulillâh",["Bismillâh","Inchâ'Allâh","Astaghfirullâh"],"Allah est satisfait du serviteur qui Le loue après avoir mangé ou bu (Muslim)."],
["adab",1,"Tu parles de ce que tu vas faire demain. Quelle formule ajoutes-tu ?","Inchâ'Allâh",["Mâ châ' Allâh", "Alhamdulillâh", "Astaghfirullâh"],"Le Coran le demande dans la sourate Al-Kahf (18:23-24)."],
["adab",1,"Tu apprends le décès de quelqu'un. Que dis-tu ?","« Innâ lillâhi wa innâ ilayhi râjiʿûn »",["« Alhamdulillâh »", "« Mâ châ' Allâh »", "« Bârak Allâhu fîk »"],"« Nous sommes à Allah et c'est vers Lui que nous retournons » (2:156)."],
["adab",1,"Tu as fait une erreur ou un péché. Quelle formule dis-tu pour demander pardon à Allah ?","Astaghfirullâh",["Mâ châ' Allâh","Inchâ'Allâh","Bismillâh"],"Le Prophète ﷺ demandait pardon à Allah plus de 70 fois par jour (Bukhârî)."],
["adab",1,"Tu trouves beau le bébé d'une amie. Que dis-tu ?","« Mâ châ' Allâh, Bârak Allâhu fîh »",["« Astaghfirullâh »", "« Innâ lillâh »", "« Rien, il ne faut pas en parler »"],"On invoque la bénédiction (baraka) sur ce qui nous plaît."],
["adab",1,"Selon un hadith, sourire à ton frère, c'est…","Une aumône (sadaqa)",["De l'hypocrisie","Une perte de temps","Réservé à la famille"],"Rapporté par at-Tirmidhî."],
["adab",1,"Que dit-on avant de commencer à lire le Coran ?","« Aʿûdhu billâhi mina ch-chaytâni r-rajîm »",["« Alhamdulillâh » trois fois", "« Allâhu akbar »", "« Astaghfirullâh »"],"On demande la protection d'Allah contre Satan (16:98)."],
["adab",1,"Une pierre ou un objet dangereux traîne au milieu du chemin. Que fais-tu ?","Je l'enlève pour que personne ne se blesse",["Je passe à côté, ce n'est pas mon problème", "Je le laisse, quelqu'un d'autre le fera", "Je le montre à mes amis et je continue"],"Selon un hadith, écarter du chemin ce qui peut blesser est une branche de la foi."],
["adab",1,"Avec quel pied entre-t-on dans la mosquée, selon la sunna ?","Le pied droit",["Le pied gauche","Les deux pieds joints","Peu importe"],"On sort avec le pied gauche. En entrant, on dit « Allâhumma ftah lî abwâba rahmatik » (Muslim)."],
["adab",1,"Ton ami te confie un secret. Que fais-tu ?","Je le garde : c'est un dépôt (amâna)",["Je le raconte à ma famille","Je le partage s'il est drôle","Je le dis à tout le monde sauf à lui"],"Trahir ce qu'on nous confie est l'un des signes de l'hypocrite (Bukhârî, Muslim)."],
["adab",1,"Tes parents te demandent quelque chose qui t'énerve. Comment te comportes-tu ?","Je leur parle avec douceur et respect",["Je soupire et je les ignore", "Je hausse le ton pour qu'ils comprennent", "Je fais semblant de ne pas entendre"],"Le Coran demande d'être bon envers ses parents et de leur parler avec respect (17:23)."],
["adab",1,"Que dit-on en entrant chez soi ?","« Bismillâh » puis « As-salâmu ʿalaykum »",["Rien","« Allâhu akbar »","« Astaghfirullâh »"],"Si on mentionne Allah en entrant, Satan dit aux siens : « Pas de nuit ni de dîner ici pour vous » (Muslim)."],
["adab",1,"Tu as promis quelque chose à quelqu'un. Que dois-tu faire ?","Tenir ma promesse",["L'oublier si c'est une petite promesse","La tenir seulement si elle est écrite","La tenir seulement si c'est un musulman"],"« Et remplissez l'engagement, car on sera interrogé sur les engagements » (17:34)."],
["adab",1,"Tu bâilles. Que recommande la sunna ?","Le retenir et mettre la main devant la bouche",["Dire « Alhamdulillâh » à voix haute","Bâiller bruyamment","Dire « Allâhu akbar »"],"Le bâillement vient de Satan ; on le retient autant qu'on peut (Bukhârî, Muslim)."],
["adab",1,"Ton voisin, qui n'est pas musulman, a besoin d'aide. Que t'enseigne l'islam ?","L'aider : le voisin a des droits, quel qu'il soit",["L'aider seulement s'il est musulman", "Ne pas s'en mêler", "Attendre qu'il le demande trois fois"],"Le Prophète ﷺ a dit que Jibrîl n'a cessé de lui recommander le voisin."],
["adab",1,"Tu es très en colère. Que conseille le Prophète ﷺ ?","Demander la protection d'Allah contre Satan et s'asseoir si on est debout",["Crier pour se libérer","Répondre tout de suite","Casser quelque chose"],"Un homme demanda un conseil. Le Prophète ﷺ répondit : « Ne te mets pas en colère », et le répéta plusieurs fois (Bukhârî)."],
["adab",1,"Quelqu'un te demande de l'aide mais tu n'as rien à lui donner. Que fais-tu ?","Je lui réponds avec gentillesse : une bonne parole est une aumône",["Je l'ignore","Je le repousse","Je lui fais la morale"],"« Une bonne parole est une aumône » (Bukhârî, Muslim)."],
["adab",1,"Comment le musulman doit-il traiter les animaux ?","Avec douceur : la bonté envers eux est récompensée",["Comme il veut, ce ne sont que des animaux", "Il ne doit pas s'en approcher", "Seulement bien traiter les animaux utiles"],"Selon un hadith, un homme a été pardonné pour avoir donné à boire à un chien assoiffé."],
["adab",1,"Un ami est malade. Que représente le fait d'aller lui rendre visite ?","Une bonne action récompensée",["Une perte de temps","Une chose interdite","Un devoir réservé aux médecins"],"Celui qui rend visite à un malade reste dans les jardins du Paradis jusqu'à son retour (Muslim)."],
["adab",1,"Quelqu'un t'a rendu service. Quelle formule dit-on pour le remercier ?","« Jazâk Allâhu khayran »",["« Innâ lillâh »", "« Astaghfirullâh »", "« Aʿûdhu billâh »"],"« Qu'Allah te récompense par le bien »."],
["adab",1,"Selon le hadith, qui mérite le plus ta bonne compagnie ?","Ta mère",["Ton père", "Ton meilleur ami", "Ton frère aîné"],"Le Prophète ﷺ a répondu trois fois « ta mère », puis « ton père »."],
["adab",1,"Un camarade fait une erreur et les autres se moquent de lui. Que fais-tu ?","Je ne me moque pas et je le défends",["Je me moque aussi pour rester dans le groupe", "Je filme pour rigoler", "Je fais semblant de ne rien voir"],"La sourate Al-Hujurât interdit de se moquer des autres (49:11)."],
["adab",2,"Pendant le Ramadan, tu as mangé par oubli. Que fais-tu ?","Je continue mon jeûne jusqu'au coucher du soleil",["J'arrête de jeûner pour la journée", "Je dois jeûner 60 jours", "Je donne une aumône à la place du jeûne"],"Selon le hadith, c'est Allah qui t'a nourri. L'école malikite demande en plus de rattraper ce jour."],
["adab",2,"Tu as oublié de dire « Bismillâh » au début du repas. Que dis-tu quand tu t'en souviens ?","« Bismillâhi awwalahu wa âkhirahu »",["« Astaghfirullâh » et j'arrête de manger","Je recommence le repas","Rien, c'est trop tard"],"Rapporté par Abû Dâwûd et at-Tirmidhî."],
