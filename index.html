<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="La Caravane du Savoir : jeu de plateau et quiz sur l'islam à jouer en famille sur un seul téléphone. Duo, Carré ou Cash, cartes chance, raccourcis, réponse au micro.">
<meta name="theme-color" content="#1B1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caravane">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>La Caravane du Savoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout : un plateau de jeu illustré posé sur une table sombre ; le dé et le joueur courant en bas ; la carte-question monte depuis le bas comme une carte qu'on tire. Univers unique (nuit + sable), assumé dans les deux thèmes. */
:root{
  color-scheme:dark;
  --table:#1B1530; --table2:#261D42; --card:#FFF8EA; --ink:#2A2118; --muted:#7A6A55; --cream:#F6E9CF; --gold:#F2B441; --gold2:#C98A1B;
  --ok:#2E9E5B; --ko:#D2493A; --duo:#3D7FD6; --carre:#E7A52C; --cash:#D2493A;
  --c-coran:#2E9E5B; --c-sira:#E8862F; --c-prophetes:#3D7FD6; --c-piliers:#D24B6A; --c-histoire:#8A5CD0; --c-culture:#E2B72E; --c-adab:#139C9A;
  --f-display:"Reem Kufi", "Trebuchet MS", sans-serif; --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0,var(--table2),var(--table));color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:12px;padding-block:0;overflow-x:hidden;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;position:relative;padding-bottom:150px}
/* barre du haut */
.top{display:flex;align-items:center;gap:8px;padding-block:10px 6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--table) 70%,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;flex:none;padding:4px 10px 4px 4px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.12);font-size:14px;font-weight:700;transition:transform .3s,background .3s}
.chip.cur{background:rgba(242,180,65,.22);border-color:var(--gold);transform:scale(1.05)}
.chip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.chip .av svg{width:20px;height:16px}
.chip small{font-weight:600;opacity:.75}
.chip .fire{color:var(--gold);font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
/* plateau */
.stage{padding-top:4px}
/* plateau 3D : la scène est une caméra, le plateau (.plane) est posé en perspective ; pions et décor sont des figurines debout */
.scene{position:relative;width:100%;aspect-ratio:360/580;perspective:1100px;perspective-origin:50% 8%;overflow:hidden;border-radius:18px;touch-action:pan-y}
.plane{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;transform-style:preserve-3d;--tilt:34deg}
.plane .lay{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.frame{position:absolute;inset:-10px;border-radius:22px;background:linear-gradient(145deg,#8A5A34,#3E2614);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 60px 10px rgba(0,0,0,.6);transform:translateZ(-1px)}
.edge{position:absolute;left:2px;right:2px;top:calc(100% + 10px);height:18px;border-radius:0 0 14px 14px;background:linear-gradient(#3E2614,#1E1008);transform-origin:50% 0;transform:rotateX(-90deg)}
.edge.l{left:-10px;right:auto;top:6px;bottom:6px;width:18px;height:auto;border-radius:14px 0 0 14px;background:linear-gradient(90deg,#1E1008,#3E2614);transform-origin:0 50%;transform:rotateY(90deg)}
.edge.r{left:auto;right:-10px;top:6px;bottom:6px;width:18px;height:auto;border-radius:0 14px 14px 0;background:linear-gradient(90deg,#3E2614,#1E1008);transform-origin:100% 50%;transform:rotateY(-90deg)}
.bb,.pw{position:absolute;left:0;top:0;transform-origin:50% 100%}
.bb svg,.pw svg{display:block;width:100%;height:100%;overflow:visible}
.psh{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(40,20,0,.55),rgba(40,20,0,0))}
.probe{position:absolute;left:0;top:0;width:2px;height:2px;margin:-1px}
/* vue 3D à la première personne */
.w3d{position:fixed;inset:0;z-index:45;opacity:0;pointer-events:none;transition:opacity .45s ease;background:#EFC89A}
.w3d.on{opacity:1}
.w3d canvas{display:block;width:100%;height:100%}
.w3d::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(40,20,5,.45));pointer-events:none}
.w3hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(20,14,36,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFF6E0;font-weight:800;z-index:1}
.w3hud i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #FFF6E0}
.w3hud small{opacity:.8;font-weight:700}
button{touch-action:manipulation}
.dock{z-index:50}.sheet{z-index:60}.cardfx{z-index:70}.win{z-index:80}.toast{z-index:75}#fx{z-index:90}
.shield{color:#7FD1FF;font-weight:800}
#board{position:absolute;left:0;top:0;display:block;width:360px;height:640px;border-radius:16px}
.sq-num{font:800 9px var(--f-body);fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
.pw .pbody{width:100%;height:100%}
.pw.cur .pbody{animation:bounce 1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes bounce{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pw.cur .pbody,.pulse{animation:none}}
/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(12,9,24,.92) 30%);display:flex;justify-content:center}
.dock-in{width:100%;max-width:560px;display:flex;align-items:center;gap:14px}
.dock .who{flex:1;min-width:0}
.dock .who small{display:block;font-size:13px;opacity:.75;font-weight:600}
.dock .who b{font-family:var(--f-display);font-size:24px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{border:0;border-radius:18px;padding:14px 22px;font-weight:800;font-size:18px;background:linear-gradient(180deg,#FFD068,var(--gold2));color:#2A1A05;box-shadow:0 6px 0 #8A5A0C,0 10px 20px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;min-height:56px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8A5A0C}
.big:disabled{filter:grayscale(.6);opacity:.6}
.big.w{width:100%}
/* dé 3D */
.dice{width:62px;height:62px;perspective:400px;flex:none}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.9,.3,1.15)}
.face{position:absolute;inset:0;background:#FFFDF6;border-radius:12px;border:2px solid #E4D2AE;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;gap:2px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.face i{border-radius:50%;background:#2A2118;visibility:hidden;margin:1px}
.face i.on{visibility:visible}
.f1{transform:rotateY(0) translateZ(31px)}.f2{transform:rotateY(90deg) translateZ(31px)}.f3{transform:rotateX(90deg) translateZ(31px)}
.f4{transform:rotateX(-90deg) translateZ(31px)}.f5{transform:rotateY(-90deg) translateZ(31px)}.f6{transform:rotateY(180deg) translateZ(31px)}
/* carte question */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet .card{pointer-events:auto;width:100%;max-width:560px;max-height:84vh;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open .card{transform:none}
.band{display:flex;align-items:center;gap:10px;padding:14px 18px;color:#fff;font-family:var(--f-display);font-size:19px;font-weight:700;position:sticky;top:0;z-index:1}
.band .sp{flex:1}
.band .pill{font-family:var(--f-body);font-size:13px;font-weight:800;background:rgba(0,0,0,.2);padding:3px 10px;border-radius:999px}
.cbody{padding:16px 18px 22px;display:grid;gap:14px}
.qfor{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qtext{font-size:clamp(21px,5.4vw,26px);font-weight:700;line-height:1.3}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{border:0;border-radius:18px;padding:12px 4px 10px;color:#fff;display:grid;gap:1px;justify-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s}
.mode:active{transform:translateY(3px)}
.mode b{font-family:var(--f-display);font-size:25px;line-height:1}
.mode span{font-size:12px;font-weight:700;opacity:.95}
.mode em{font-style:normal;font-size:26px;font-weight:800;line-height:1.1}
.mode small{font-size:11px;font-weight:800;background:rgba(0,0,0,.2);border-radius:999px;padding:1px 8px}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{text-align:left;border:2.5px solid #E6D6B6;background:#FFFDF6;border-radius:16px;padding:14px 16px;font-size:18px;font-weight:700;color:var(--ink);transition:transform .15s}
.choice:active{transform:scale(.98)}
.choice.right{border-color:var(--ok);background:#E3F5EA;animation:pop .4s}
.choice.wrong{border-color:var(--ko);background:#FBE5E2;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{border-radius:16px;padding:12px 14px;background:#E3F5EA;border:2.5px solid var(--ok)}
.answer b{font-size:21px}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:0}
.note{font-size:15px;color:var(--muted);margin:0}
.heard{border-radius:16px;padding:12px 14px;border:2.5px dashed #E0CDA6;display:grid;gap:4px}
.heard q{font-size:20px;font-weight:800;quotes:"« " " »"}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{border:0;border-radius:16px;min-height:56px;font-size:19px;font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.judge .yes{background:var(--ok)}.judge .no{background:var(--ko)}
.judge .sugg{outline:4px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ghostbtn{border:2px solid #E0CDA6;background:transparent;border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink);min-height:48px;flex:1}
.mic{border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:var(--ink);color:var(--card);min-height:48px;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mic.rec{background:var(--ko);animation:pulseb 1s infinite}
@keyframes pulseb{50%{box-shadow:0 0 0 8px rgba(210,73,58,.25)}}
.tiny{font-size:13px;color:var(--muted);margin:0}
.timer{height:8px;border-radius:4px;background:#EADBBB;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold2);transform-origin:left}
.say{border:1.5px solid #E0CDA6;background:transparent;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;color:var(--ink)}
.pickcat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pickcat button:last-child:nth-child(odd){grid-column:1/-1}
.pickcat button{border:0;border-radius:16px;padding:16px 8px;color:#fff;font-family:var(--f-display);font-size:17px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.25)}
/* bannière résultat */
.toast{position:fixed;left:50%;top:22%;z-index:30;transform:translate(-50%,-20px) scale(.8);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.9,.3,1.3);text-align:center;width:min(92vw,480px)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast .t{display:inline-block;font-family:var(--f-display);font-size:clamp(30px,9vw,46px);font-weight:700;padding:10px 26px;border-radius:20px;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast .s{display:block;margin-top:8px;font-weight:800;font-size:17px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.cardfx{position:fixed;inset:0;z-index:32;display:grid;place-items:center;background:rgba(10,7,20,.6);opacity:0;pointer-events:none;transition:opacity .3s;padding:20px;perspective:1200px}
.cardfx.show{opacity:1;pointer-events:auto}
.flip{width:min(78vw,300px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform:rotateY(0) scale(.7)}
.cardfx.turned .flip{transform:rotateY(180deg) scale(1)}
.cside{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden}
.cback{background:repeating-linear-gradient(45deg,#8A5A0C 0 10px,#A8711A 10px 20px);border:6px solid #F2B441;display:grid;place-items:center}
.cback span{font-family:var(--f-display);font-size:64px;color:#FFE3A0;text-shadow:0 3px 0 #5B3A08}
.cfront{transform:rotateY(180deg);background:var(--card);color:var(--ink);display:flex;flex-direction:column}
.cfront .ch{padding:14px 16px;color:#fff;font-family:var(--f-display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.cfront .cb{flex:1;padding:16px 18px;display:grid;align-content:center;gap:10px;text-align:center}
.cfront h3{font-size:clamp(24px,7vw,30px)}
.cfront p{margin:0;font-size:17px;font-weight:600}
.cfront .cf{padding:0 16px 16px;display:grid;gap:8px}
.cfront .pk{border:0;border-radius:12px;padding:10px;font-weight:800;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
/* accueil */
.setup{padding-block:6px 30px;display:grid;gap:14px}
.hero{display:grid;gap:10px;text-align:center;justify-items:center;padding-top:10px}
.hero h1{font-size:clamp(36px,10vw,56px);color:var(--gold);text-shadow:0 3px 0 #6B3F08}
.hero p{margin:0;opacity:.85;max-width:44ch}
.hero svg{width:min(80vw,320px);height:auto}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rule{border-radius:16px;padding:10px 8px;color:#fff;text-align:center;display:grid;gap:2px}
.rule b{font-family:var(--f-display);font-size:22px}
.rule span{font-size:12.5px;font-weight:700;line-height:1.25}
.panel{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;display:grid;gap:12px}
.lab2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:0;color:var(--gold)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.prow .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.prow .av svg{width:26px;height:21px}
.prow input,.prow select{border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.25);min-width:0;width:100%}
.prow select{width:auto}
.prow .x{width:40px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);font-size:20px}
.seg{display:flex;border:1.5px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-weight:800;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2A1A05}
.hint{font-size:14px;opacity:.75;margin:0}
.addbtn{border:1.5px dashed rgba(255,255,255,.3);background:transparent;border-radius:12px;padding:10px;font-weight:800}
/* victoire */
.win{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(10,7,20,.72);padding:20px;opacity:0;pointer-events:none;transition:opacity .5s}
.win.show{opacity:1;pointer-events:auto}
.win .box{background:var(--card);color:var(--ink);border-radius:26px;padding:24px 20px;width:min(100%,440px);display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.win h2{font-size:clamp(30px,8vw,42px)}
.rank{display:grid;gap:6px;text-align:left}
.rank div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#F4E8CF;font-weight:700}
.rank .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.rank .av svg{width:22px;height:18px}
@media (max-width:400px){.rules span{font-size:11.5px}}
</style>

</head>

}
async function resolve(ok) {
  if (busy) return; busy = true;
  try { await resolveImpl(ok); } catch (e) { console.error(e); busy = false; game.q = null; game.phase = "roll"; save(); next(); }

async function resolveImpl(ok) {

    const [cx, cy] = center(); confetti(cx, cy, g.mode === "cash" ? 110 : 60);
    await sleep(500);

    const r = await land(pi); if (r === "q") { busy = false; return; } again = r === true;
    if (p.pos >= n - 1) { SFX.bonus(); toast("Aux portes de la ville !", "Question finale au prochain tour", "#8A5A0C", 1900); const [x, y] = center(); confetti(x, y, 80); await sleep(1100); }

const pick = a => a[Math.floor(Math.random() * a.length)];
/* ---------- cases spéciales, raccourcis, cartes ---------- */
async function moveBy(pi, k) { const p = game.players[pi], n = game.cells.length, to = Math.max(0, Math.min(n - 1, p.pos + k)); if (to !== p.pos) await animateMove(pi, p.pos, to); }
async function jumpMove(pi, to) {
  const p0 = game.players[pi];

function protect(p) { if (!p.shield) return false; p.shield = false; SFX.bonus(); toast("Talisman !", "Le malheur est évité", "#3D7FD6", 1500); return true; }
async function land(pi) {

  if (cell.t === "sable") { if (protect(p)) { await sleep(1000); return false; } SFX.whoosh(); toast("Tempête de sable", "−3 cases", "#B5651D", 1500); await sleep(900); await moveBy(pi, -3); return false; }

function ptScreen(i) { const pr = $("#probe"), pt = geo.pts[i]; if (!pr) return [innerWidth / 2, innerHeight / 2]; pr.style.transform = `translate3d(${pt.x}px,${pt.y}px,0)`; const b = pr.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; }
const leaderIdx = () => { let m = -1, k = 0; game.players.forEach((x, i) => { if (x.pos > m) { m = x.pos; k = i; } }); return k; };
const lastIdx = () => { let m = 1e9, k = 0; game.players.forEach((x, i) => { if (x.pos < m) { m = x.pos; k = i; } }); return k; };
const CARDS = {
  av3: { k: "good", t: "Vent du désert", d: "Un vent puissant pousse ta caravane : avance de 3 cases.", run: pi => moveBy(pi, 3) },
  av2: { k: "good", t: "Guide bédouin", d: "Il connaît un sentier secret : avance de 2 cases.", run: pi => moveBy(pi, 2) },
  tresor: { k: "good", t: "Carte au trésor", d: "Rends-toi directement à la prochaine oasis !", run: async pi => { const p = game.players[pi], i = game.cells.findIndex((c, j) => j > p.pos && c.t === "oasis"); if (i > 0) { await jumpMove(pi, i); return true; } await moveBy(pi, 3); } },
  rejoue: { k: "good", t: "Chameau infatigable", d: "Ton chameau a de l'énergie à revendre : tu rejoues tout de suite !", run: () => true },
  bouclier: { k: "good", t: "Talisman du voyageur", d: "Tu es protégé du prochain malheur : tempête, puits, sables mouvants ou carte de malchance.", run: pi => { game.players[pi].shield = true; } },
  echange: { k: "good", t: "Caravanes échangées", d: "Échange ta place avec le joueur en tête !", run: async pi => { const L = leaderIdx(), a = game.players[pi], b = game.players[L]; if (L === pi || b.pos === a.pos) { toast("Tu es déjà en tête !", "Avance d'une case", "#2E9E5B", 1300); await moveBy(pi, 1); return; } const pa = a.pos, pb = b.pos; await jumpMove(pi, pb); await jumpMove(L, pa); } },
  sabotage: { k: "good", t: "Tempête ciblée", d: "Choisis un joueur : il recule de 3 cases.", pick: true, run: async (pi, target) => { if (target != null) { if (protect(game.players[target])) { await sleep(900); return; } await moveBy(target, -3); } } },
  defi: { k: "good", t: "Défi du savant", d: "Réponds à une question en Cash : si c'est juste, avance de 4 cases !", run: () => "defi" },
  re2: { k: "bad", t: "Tempête de sable", d: "Le sable t'aveugle : recule de 2 cases.", run: pi => moveBy(pi, -2) },
  re3: { k: "bad", t: "Mirage", d: "Tu as suivi un mirage : recule de 3 cases.", run: pi => moveBy(pi, -3) },
  re1: { k: "bad", t: "Sandale cassée", d: "Il faut la réparer : recule d'une case.", run: pi => moveBy(pi, -1) },
  tetu: { k: "bad", t: "Chameau têtu", d: "Ton chameau refuse d'avancer : tu passes ton prochain tour.", run: pi => { game.players[pi].skip = true; } },
  chef: { k: "all", t: "Vent contraire", d: "Le joueur en tête recule de 4 cases. Même si c'est toi !", run: async () => { const L = leaderIdx(); if (protect(game.players[L])) { await sleep(900); return; } await moveBy(L, -4); } },
  solid: { k: "all", t: "Solidarité", d: "Le joueur le plus en retard avance de 4 cases.", run: async () => { await moveBy(lastIdx(), 4); } },
  tempete: { k: "all", t: "Tempête générale", d: "Tous les autres joueurs reculent de 2 cases.", run: async pi => { for (let i = 0; i < game.players.length; i++) if (i !== pi) { if (protect(game.players[i])) { await sleep(700); continue; } await moveBy(i, -2); } } },

};
const DECK = ["av3", "av3", "av2", "tresor", "rejoue", "bouclier", "echange", "sabotage", "defi", "defi", "re2", "re2", "re3", "re1", "tetu", "chef", "chef", "solid", "tempete", "chamboule"];
async function drawCard(pi) {

  const id = game.deck.pop(), c = CARDS[id], p = game.players[pi]; save();

  const box = $("#cardfx"); SFX.whoosh();
  const others = game.players.map((x, i) => [x, i]).filter(([, i]) => i !== pi);
  box.innerHTML = `<div class="flip"><div class="cside cback"><span>?</span></div><div class="cside cfront"><div class="ch" style="background:${head[1]}">${head[0]}</div><div class="cb"><h3>${c.t}</h3><p>${c.d}</p></div><div class="cf">${c.pick ? others.map(([x, i]) => `<button class="pk" data-t="${i}" style="background:${PCOL[i]}">${esc(x.name)} recule</button>`).join("") : `<button class="big w" id="cok">OK</button>`}</div></div></div>`;

function next() { game.cur = (game.cur + 1) % game.players.length; game.phase = "roll"; save(); step(); }

function validGame(g) { try { return g && Array.isArray(g.cells) && g.cells.length >= 10 && Array.isArray(g.players) && g.players.length >= 2 && g.players.every(p => typeof p.pos === "number" && p.pos >= 0 && p.pos < g.cells.length) && g.cur >= 0 && g.cur < g.players.length && Array.isArray(g.used); } catch (e) { return false; } }
