["adab",2,"Selon le Coran (4:86), comment doit-on répondre à une salutation ?","Par une salutation égale ou meilleure",["Par une salutation plus courte","Seulement si on connaît la personne","Ce n'est pas obligatoire"],"À « As-salâmu ʿalaykum », on peut répondre « Wa ʿalaykumu s-salâm wa rahmatu Llâh »."],
["adab",2,"La médisance (al-ghîba), c'est…","Dire sur quelqu'un d'absent une chose vraie qu'il n'aimerait pas entendre",["Inventer un mensonge sur quelqu'un", "Critiquer quelqu'un en face de lui", "Parler de quelqu'un en bien"],"Si ce qu'on dit est faux, c'est encore pire : c'est la calomnie (buhtân)."],
["adab",2,"Dans le Coran, à quoi la médisance est-elle comparée ?","Manger la chair de son frère mort",["Boire de l'eau salée", "Allumer un feu", "Marcher sans chaussures"],"Sourate Al-Hujurât (49:12)."],
["adab",2,"Quelqu'un rapporte des paroles pour fâcher deux personnes entre elles. Comment s'appelle ce péché ?","An-namîma (le colportage)",["Ar-riyâ' (l'ostentation)","Al-kibr (l'orgueil)","Al-hasad (la jalousie)"],"« Le colporteur n'entrera pas au Paradis » (Bukhârî, Muslim)."],
["adab",2,"Tu reçois une rumeur grave sur quelqu'un dans un groupe WhatsApp. Que demande le Coran ?","Vérifier l'information avant de la croire ou de la partager",["La partager pour prévenir tout le monde", "La croire si plusieurs personnes la répètent", "La partager en précisant « à vérifier »"],"Sourate Al-Hujurât (49:6)."],
["adab",2,"Tu es fâché avec un ami musulman. Combien de jours au maximum le Prophète ﷺ permet-il de se bouder ?","3 jours",["1 semaine","40 jours","1 mois"],"« Il n'est pas permis à un musulman de bouder son frère plus de trois jours » (Bukhârî, Muslim)."],
["adab",2,"Deux musulmans sont fâchés. Selon le hadith, lequel est le meilleur des deux ?","Celui qui salue le premier",["Celui qui avait raison","Le plus âgé","Celui qui attend des excuses"],"C'est la suite du même hadith (Bukhârî, Muslim)."],
["adab",2,"Tes parents ne sont pas musulmans. Comment le Coran demande-t-il de les traiter ?","Rester bon avec eux, sans leur obéir dans ce qui va contre la foi",["Couper les liens avec eux", "Leur obéir en tout", "Ne leur parler que de religion"],"Sourate Luqmân (31:15)."],
["adab",2,"Tu prêtes de l'argent à quelqu'un. Que recommande le plus long verset du Coran ?","Mettre la dette par écrit",["Ne rien écrire, par confiance", "Demander des intérêts", "Exiger un objet en échange"],"Âyat ad-dayn, sourate Al-Baqara (2:282)."],
["adab",2,"Quelqu'un te fait du mal. Que conseille le Coran (41:34) ?","Repousser le mal par ce qui est meilleur",["Rendre la pareille","Se venger en secret","Couper définitivement les ponts"],"Le verset ajoute : celui avec qui tu étais en conflit deviendra alors comme un ami chaleureux."],
["adab",2,"Tu es en voyage. Quel allègement est permis pour les prières de 4 rakʿa ?","Les raccourcir à 2 rakʿa",["Ne plus les prier", "Les prier sans ablutions", "Les remplacer par une aumône"],"Le Maghrib (3 rakʿa) et le Fajr (2 rakʿa) ne se raccourcissent pas."],
["adab",2,"Tu t'es endormi et tu as raté la prière du Fajr. Que fais-tu ?","Je la prie dès que je me réveille",["Je la laisse tomber","Je la prie le lendemain avec l'autre Fajr","Je prie deux fois le Dhuhr"],"« Celui qui oublie une prière ou s'endort, qu'il la prie dès qu'il s'en souvient » (Muslim)."],
["adab",2,"Avec quel pied les savants recommandent-ils d'entrer dans les toilettes ?","Le pied gauche",["Le pied droit", "Les deux pieds joints", "Peu importe"],"Le droit est réservé à ce qui est noble (mosquée, chaussures…), le gauche à l'inverse. On dit en entrant : « Allâhumma innî aʿûdhu bika mina l-khubuthi wa l-khabâ'ith » (Bukhârî, Muslim)."],
["adab",2,"Quelqu'un te fait un cadeau. Que faisait le Prophète ﷺ ?","Il acceptait les cadeaux et offrait en retour",["Il refusait par politesse","Il les donnait aussitôt à quelqu'un d'autre","Il n'acceptait que la nourriture"],"« Offrez-vous des cadeaux, vous vous aimerez » (Bukhârî, al-Adab al-Mufrad)."],
["adab",2,"Tu es invité au repas de mariage (walîma) d'un ami. Que recommande la sunna ?","Répondre à l'invitation",["Refuser pour ne pas déranger","Venir seulement si c'est la famille","Envoyer de l'argent à la place"],"« Si l'un de vous est invité à un repas de noces, qu'il y aille » (Bukhârî, Muslim)."],
["adab",2,"« Aucun de vous ne croit vraiment tant qu'il n'aime pas pour son frère… »","… ce qu'il aime pour lui-même",["… plus de richesse que pour lui","… la meilleure place à la mosquée","… autant qu'il aime ses parents"],"Rapporté par al-Bukhârî et Muslim, d'après Anas."],
["adab",2,"« Que celui qui croit en Allah et au Jour dernier dise du bien ou… »","… qu'il se taise",["… qu'il s'en aille","… qu'il prie","… qu'il demande pardon"],"Rapporté par al-Bukhârî et Muslim."],
["adab",2,"Est-il permis de jurer « sur la tête de ma mère » ou « sur ma vie » ?","Non, on ne jure que par Allah",["Oui, si c'est pour dire la vérité","Oui, si c'est pour rire","Oui, mais seulement pour des petites choses"],"« Celui qui jure, qu'il jure par Allah ou qu'il se taise » (Bukhârî, Muslim)."],
["adab",2,"Selon le hadith, quels sont les trois signes de l'hypocrite ?","Il ment, il trahit la confiance et ne tient pas ses promesses",["Il dort, il mange et il rit beaucoup","Il est riche, célèbre et voyage beaucoup","Il parle fort, marche vite et s'habille bien"],"Rapporté par al-Bukhârî et Muslim."],
["adab",2,"Selon un hadith, quel verset récité avant de dormir protège jusqu'au matin ?","Âyat al-Kursî",["Le premier verset de Al-Fâtiha","Le dernier verset de Al-Baqara seulement","Le premier verset de Yâ-Sîn"],"C'est Satan lui-même qui l'apprit à Abû Hurayra. Le Prophète ﷺ dit : « Il t'a dit vrai, alors qu'il est menteur » (Bukhârî)."],
["adab",2,"Tu entres dans une mosquée en dehors de la prière en commun. Que recommande la sunna avant de t'asseoir ?","Prier 2 rakʿa (tahiyyat al-masjid)",["Faire le tawâf de la mosquée","Réciter l'adhân","Rien, on s'assoit directement"],"« Quand l'un de vous entre à la mosquée, qu'il ne s'assoie pas avant d'avoir prié deux rakʿa » (Bukhârî, Muslim)."],
["adab",2,"Que faut-il éviter quand quelqu'un est en train de prier ?","Passer juste devant lui",["Prier à côté de lui","Lire le Coran dans la même pièce","Faire ses ablutions"],"S'il savait la gravité de cet acte, il préférerait attendre quarante plutôt que de passer devant (Bukhârî, Muslim)."],
["adab",2,"Pendant le sermon (khutba) du vendredi, que doit-on faire ?","Écouter en silence",["Discuter à voix basse", "Lire ses messages", "Dire « chut ! » à ceux qui parlent"],"Selon le hadith, même dire « tais-toi » à son voisin pendant la khutba est une parole vaine (Bukhârî, Muslim)."],
["adab",2,"« Le fort n'est pas celui qui terrasse les autres, mais celui qui… »","… se maîtrise quand il est en colère",["… prie toute la nuit","… a le plus d'amis","… gagne toutes les disputes"],"Rapporté par al-Bukhârî et Muslim."],
["adab",2,"Que dit le Coran (7:31) à propos de la nourriture ?","Mangez et buvez, mais ne gaspillez pas",["Ne mangez qu'une fois par jour","Jeûnez un jour sur deux","Mangez autant que vous voulez"],"Le Prophète ﷺ conseillait un tiers de nourriture, un tiers de boisson et un tiers d'air dans le ventre (Tirmidhî)."],
["adab",2,"Selon le hadith, « n'est pas des nôtres » celui qui…","… n'a pas de pitié pour nos petits et ne respecte pas nos aînés",["… n'a pas fait le pèlerinage","… ne parle pas arabe","… n'habite pas près d'une mosquée"],"Rapporté par at-Tirmidhî."],
["adab",2,"Selon le hadith, le vrai musulman est celui dont les autres sont à l'abri…","… de sa langue et de sa main",["… de son argent","… de son regard","… de ses voisins"],"Rapporté par al-Bukhârî et Muslim."],
["adab",2,"Selon un hadith, pourquoi une femme est-elle entrée en Enfer ?","Elle avait enfermé une chatte sans la nourrir",["Elle ne savait pas lire","Elle était pauvre","Elle avait trop de chats"],"Elle ne la nourrissait pas et ne la laissait pas non plus chercher à manger (Bukhârî, Muslim)."],
["adab",2,"Selon le hadith, « le meilleur d'entre vous est… »","… le meilleur envers sa famille",["… le plus riche","… celui qui parle le mieux","… celui qui a le plus voyagé"],"« … et je suis le meilleur d'entre vous envers ma famille » (Tirmidhî)."],
["adab",3,"Pendant la prière, tu doutes : 3 ou 4 rakʿa ? Que fais-tu ?","Je retiens 3, je complète et je fais les prosternations de l'oubli (sujûd as-sahw)",["Je recommence la prière depuis le début", "Je retiens 4 et je termine", "J'arrête et je prie plus tard"],"On se base sur ce qui est certain, c'est-à-dire le plus petit nombre."],
["adab",3,"Tu montes dans une voiture ou un avion. Quelle invocation le Coran enseigne-t-il ?","« Subhâna lladhî sakhkhara lanâ hâdhâ… »",["« Innâ lillâhi wa innâ ilayhi râjiʿûn »", "« Rabbanâ âtinâ fî d-dunyâ hasana… »", "« Lâ ilâha illâ anta subhânaka… »"],"« Gloire à Celui qui a mis ceci à notre service » (43:13)."],
["adab",3,"Tu as juré par Allah de faire quelque chose, puis tu ne l'as pas fait. Quelle est l'expiation (kaffâra) ?","Nourrir ou vêtir dix pauvres, sinon jeûner trois jours",["Jeûner 60 jours d'affilée", "Donner un euro à la mosquée", "Il n'y a rien à faire"],"Sourate Al-Mâ'ida (5:89)."],
["adab",3,"Dans quels cas le Prophète ﷺ a-t-il toléré de ne pas dire l'exacte vérité ?","Pour réconcilier des gens, en temps de guerre, et entre époux pour s'entendre",["Pour éviter une punition", "Pour faire rire ses amis", "Jamais, dans aucun cas"],"Hadith d'Umm Kulthûm (Muslim). Tromper pour nuire reste interdit."],
["adab",3,"Tu trouves un portefeuille perdu dans la rue. Que dit la sunna ?","L'annoncer pour retrouver son propriétaire",["Le garder, c'est un cadeau d'Allah", "Le jeter", "Donner l'argent aux pauvres tout de suite"],"Le hadith demande de faire connaître l'objet trouvé pendant un an."],
["adab",3,"Que dit-on en sortant de chez soi, selon la sunna ?","« Bismillâh, tawakkaltu ʿalâ Llâh, lâ hawla wa lâ quwwata illâ billâh »",["« Allâhumma bârik lanâ fîmâ razaqtanâ »","« Subhâna rabbiya l-aʿlâ »","« Rabbi zidnî ʿilmâ »"],"On lui dit alors : « Tu es guidé, protégé et préservé » (Abû Dâwûd, Tirmidhî)."],
["adab",3,"Selon le Coran (25:63), que répondent les serviteurs du Tout Miséricordieux quand des ignorants les provoquent ?","« Paix ! » (salâmâ)",["Ils les insultent en retour","Ils se taisent pour toujours","Ils les dénoncent"],"C'est le début du portrait des « serviteurs du Tout Miséricordieux », à la fin de la sourate Al-Furqân."],
["adab",3,"Selon le hadith, que recommande la sunna avant la prière du vendredi ?","Se laver (ghusl), se parfumer et mettre de beaux habits",["Jeûner la veille","Faire le tour de la mosquée","Arriver juste à la fin du sermon"],"Rapporté par al-Bukhârî. Il est aussi recommandé d'utiliser le siwâk."],
["adab",3,"Tu vois une injustice. Selon le hadith, quel est le degré le plus faible de la foi ?","La désapprouver dans son cœur",["La filmer", "En parler plus tard", "Faire comme si de rien n'était"],"Le hadith dit : la changer par la main, sinon par la parole, sinon par le cœur."],
["adab",3,"Le Prophète ﷺ a conseillé à Abû Dharr, quand il prépare un bouillon…","… d'y ajouter de l'eau et d'en donner à ses voisins",["… de le manger seul","… de le garder pour le lendemain","… de n'inviter que sa famille"],"Rapporté par Muslim. Le voisin a de grands droits en islam."],
["coran",1,"Quelle sourate récite-t-on dans chaque rakʿa de la prière ?","Al-Fâtiha",["Al-Ikhlâs","An-Nâs","Al-Kawthar"],"« Pas de prière pour qui ne récite pas la Fâtiha » (Bukhârî, Muslim)."],
["coran",1,"Combien de versets compte la sourate Al-Fâtiha ?","7",["5","6","10"],"Le Coran l'appelle « les sept versets répétés » (as-sabʿ al-mathânî, 15:87)."],
["coran",1,"Que signifie le mot « Qur'ân » (Coran) ?","La lecture, la récitation",["La lumière","La loi","Le message"],"De la racine « qara'a », lire, réciter, comme le premier mot révélé : « Iqra' »."],
["coran",1,"Quelle sourate commence par « Qul huwa Llâhu ahad » ?","Al-Ikhlâs",["Al-Falaq","An-Nâs","Al-Kâfirûn"],"« Al-Ikhlâs » signifie la sincérité, la pureté du monothéisme."],
["coran",1,"Comment appelle-t-on un verset du Coran ?","Une âya",["Une sourate","Un juz'","Un hadith"],"Le mot signifie aussi « signe » ou « preuve »."],
["coran",1,"Comment appelle-t-on un chapitre du Coran ?","Une sourate",["Une âya","Un hizb","Une sunna"],"Le Coran en compte 114, de 3 à 286 versets."],
["coran",1,"Que signifie « Al-Baqara », le nom de la 2e sourate ?","La vache",["L'éléphant","La fourmi","Le chameau"],"Elle raconte l'histoire de la vache que les Banû Isrâ'îl devaient sacrifier (2:67-73)."],
["coran",1,"Que signifie « Al-Fîl », le nom de la sourate 105 ?","L'éléphant",["Le cheval","La baleine","Le lion"],"Elle raconte l'armée d'Abraha venue détruire la Kaʿba, l'année de naissance du Prophète ﷺ."],
["coran",2,"Quelle sourate porte le nom d'un fruit ?","At-Tîn (la figue)",["Al-Mâ'ida","Al-Fîl","Al-Kahf"],"Elle commence par « Par le figuier et l'olivier »."],
["coran",3,"Combien de versets compte le Coran, selon le décompte le plus répandu ?","6 236",["6 666", "6 000", "7 000"],"Le chiffre de 6 666 souvent cité n'est pas exact."],
["sira",1,"Qui est le dernier prophète en islam ?","Muhammad ﷺ",["ʿÎsâ","Mûsâ","Ibrâhîm"],"Le Coran l'appelle « le sceau des prophètes » (33:40)."],
["sira",1,"Comment s'appelle la mosquée du Prophète ﷺ à Médine ?","Al-Masjid an-Nabawî",["Al-Aqsâ","Al-Masjid al-Harâm","La mosquée de Qubâ'"],"Une prière y vaut mieux que mille ailleurs, sauf à la Mosquée sacrée de La Mecque (Bukhârî, Muslim)."],
["sira",1,"Que signifie « ﷺ », écrit après le nom du Prophète ?","Que la prière et la paix d'Allah soient sur lui",["Qu'Allah l'agrée","Paix à son âme","Gloire à Allah"],"« Sallâ Llâhu ʿalayhi wa sallam ». Allah demande aux croyants de prier sur le Prophète (33:56)."],
["sira",1,"Le Prophète ﷺ savait-il lire et écrire ?","Non, il était illettré (ummî)",["Oui, il était scribe","Oui, il a écrit le Coran lui-même","Seulement en persan"],"Pour les croyants, c'est une preuve : il n'aurait pas pu recopier le Coran dans d'anciens livres (29:48)."],
["sira",2,"Quel métier le Prophète ﷺ exerçait-il pour le compte de Khadîja ?","Il menait ses caravanes de commerce",["Forgeron","Agriculteur","Scribe"],"Khadîja fut impressionnée par son honnêteté, puis lui proposa le mariage."],
["sira",2,"Lors de quelle bataille des archers ont-ils quitté leur poste, causant de lourdes pertes ?","Uhud",["Badr","Al-Khandaq","Hunayn"],"En l'an 3. Croyant la bataille gagnée, les archers quittèrent la colline malgré l'ordre du Prophète ﷺ."],
["sira",3,"Quel jour de la semaine le Prophète ﷺ est-il né ?","Le lundi",["Le vendredi", "Le jeudi", "Le dimanche"],"Il a aussi reçu la première révélation un lundi."],
["prophetes",1,"Quel prophète est appelé « Al-Masîh » (le Messie) ?","ʿÎsâ (Jésus)",["Mûsâ","Yahyâ","Ilyâs"],"Selon le Coran, il n'a été ni tué ni crucifié, mais élevé auprès d'Allah (4:157-158)."],
["prophetes",1,"Quel prophète a fendu la mer avec son bâton ?","Mûsâ (Moïse)",["Nûh","Ibrâhîm","Sulaymân"],"Pharaon et son armée furent noyés en le poursuivant (26:63-66)."],
["prophetes",1,"Quel prophète a reçu l'ordre de sacrifier son fils, remplacé ensuite par un bélier ?","Ibrâhîm",["Yaʿqûb","Âdam","Nûh"],"Ibrâhîm et son fils acceptèrent l'ordre d'Allah : c'est l'origine du sacrifice de l'Aïd al-Adhâ (37:102-107)."],
["prophetes",2,"Quelle est la seule femme citée par son nom dans le Coran ?","Maryam",["Âsiya","Khadîja","Hawwâ'"],"Aucune autre femme, pas même les épouses du Prophète ﷺ, n'est appelée par son nom dans le Coran."],
["prophetes",3,"Selon le hadith, comment s'appelait le jeune serviteur qui accompagnait Mûsâ à la recherche d'al-Khadir ?","Yûshaʿ ibn Nûn",["Hârûn","Ilyâs","Yûsuf"],"Il conduisit plus tard les Banû Isrâ'îl vers la Terre sainte."],
["piliers",1,"Comment s'appelle le mois de jeûne ?","Ramadan",["Muharram","Chaʿbân","Rajab"],"C'est le 9e mois du calendrier hégirien."],
["piliers",1,"Pendant le Ramadan, on jeûne…","De l'aube au coucher du soleil",["Du matin à midi","Toute la journée et toute la nuit","Seulement le vendredi"],"On s'abstient de manger, de boire et des relations conjugales (2:187)."],
["piliers",1,"Comment s'appelle le repas de rupture du jeûne ?","L'iftâr",["Le suhûr","La walîma","Le ʿîd"],"Les gens resteront dans le bien tant qu'ils se hâteront de rompre le jeûne (Bukhârî, Muslim)."],
["piliers",1,"Quel jour a lieu la grande prière en commun de la semaine ?","Le vendredi",["Le lundi","Le samedi","Le dimanche"],"« Ô vous qui croyez, quand on appelle à la prière du vendredi, accourez au rappel d'Allah » (62:9)."],
["piliers",1,"Comment appelle-t-on celui qui fait l'appel à la prière ?","Le muezzin (mu'adhdhin)",["L'imam","Le mufti","Le hâfiz"],"Selon le hadith, les muezzins auront le plus long cou le Jour de la résurrection, signe d'honneur (Muslim)."],
["piliers",1,"Comment s'appelle la prière du coucher du soleil ?","Al-Maghrib",["Al-ʿAsr","Al-ʿIchâ'","Adh-Dhuhr"],"Elle se prie juste après le coucher du soleil, au moment de rompre le jeûne pendant le Ramadan."],
["piliers",1,"Quelle parole prononce-t-on pour commencer la prière ?","« Allâhu akbar »",["« Bismillâh »","« As-salâmu ʿalaykum »","« Âmîn »"],"Ce premier takbîr s'appelle « takbîrat al-ihrâm » : il fait entrer dans la prière."],
["piliers",1,"Combien de fois dans sa vie le pèlerinage (Hajj) est-il obligatoire ?","Une fois, pour qui en a les moyens",["Chaque année","Deux fois","Jamais, il est facultatif"],"Interrogé, le Prophète ﷺ a dit : « Si je disais oui (chaque année), cela deviendrait obligatoire » (Muslim)."],
["piliers",2,"Combien de rakʿa compte la prière du ʿIchâ' ?","4",["2","3","5"],"C'est la dernière prière obligatoire de la journée, à la nuit tombée."],
["piliers",2,"Combien de rakʿa compte la prière de l'ʿAsr ?","4",["2","3","6"],"Selon de nombreux savants, c'est « la prière médiane » qu'il faut préserver tout particulièrement (2:238)."],
["piliers",3,"Que dit-on en se prosternant (sujûd) ?","« Subhâna rabbiya l-aʿlâ »",["« Subhâna rabbiya l-ʿazîm »", "« Samiʿa Llâhu liman hamidah »", "« Rabbanâ wa laka l-hamd »"],"En inclinaison (rukûʿ), on dit « Subhâna rabbiya l-ʿazîm »."],
["piliers",3,"Lors du Miʿrâj, combien de prières avaient d'abord été prescrites avant d'être réduites à 5 ?","50",["10","7","100"],"Sur le conseil de Mûsâ, le Prophète ﷺ demanda un allègement. Les 5 prières valent la récompense de 50 (Bukhârî, Muslim)."],
["histoire",1,"Quelle est la ville la plus sainte de l'islam ?","La Mecque",["Médine","Jérusalem","Le Caire"],"On y trouve la Kaʿba et la Mosquée sacrée (al-Masjid al-Harâm)."],
["histoire",1,"Quelle est la deuxième ville sainte de l'islam ?","Médine",["Jérusalem","Damas","Bagdad"],"Le Prophète ﷺ y vécut ses dix dernières années et y est enterré."],
["histoire",1,"Le calendrier musulman commence à partir de quel événement ?","L'Hégire, l'émigration vers Médine",["La naissance du Prophète ﷺ","La première révélation","La conquête de La Mecque"],"Il commence en 622, l'an 1 de l'Hégire."],
["histoire",1,"Le calendrier musulman est basé sur…","La lune",["Le soleil","Les saisons","Les étoiles"],"Les mois commencent avec le nouveau croissant. L'année lunaire compte environ 354 jours, 11 de moins que l'année solaire."],
["histoire",2,"Quelle ville les Ottomans ont-ils choisie comme capitale après 1453 ?","Constantinople (Istanbul)",["Damas","Le Caire","Bagdad"],"La basilique Sainte-Sophie fut alors transformée en mosquée."],
["histoire",3,"Quel calife omeyyade a fait construire le Dôme du Rocher à Jérusalem ?","ʿAbd al-Malik ibn Marwân",["Muʿâwiya","Hârûn ar-Rachîd","Al-Walîd"],"Achevé vers 691. Il se trouve sur l'esplanade d'al-Aqsâ, mais ce n'est pas la mosquée al-Aqsâ elle-même."],
["histoire",3,"Quel calife omeyyade, célèbre pour sa justice, est parfois appelé « le cinquième calife bien guidé » ?","ʿUmar ibn ʿAbd al-ʿAzîz",["Muʿâwiya","Hârûn ar-Rachîd","Al-Maʾmûn"],"Arrière-petit-fils de ʿUmar ibn al-Khattâb par sa mère, il régna peu (717-720) mais avec une grande justice."],
["culture",1,"Que signifie « Subhânallâh » ?","Gloire à Allah",["Allah est le plus grand","Louange à Allah","Au nom d'Allah"],"« Subhânallâh » et « Alhamdulillâh » remplissent ce qui est entre le ciel et la terre (Muslim)."],
["culture",1,"Que signifie « Allâhu akbar » ?","Allah est le plus grand",["Gloire à Allah","Allah est unique","Allah est miséricordieux"],"Cette formule ouvre l'appel à la prière et chaque prière."],
["culture",1,"Que signifie « Bismillâh » ?","Au nom d'Allah",["Merci Allah","Allah est grand","Si Allah le veut"],"Toutes les sourates du Coran sauf At-Tawba commencent par « Bismillâh ar-Rahmân ar-Rahîm »."],
["culture",1,"Que signifie « As-salâmu ʿalaykum » ?","Que la paix soit sur vous",["Bonjour mon frère","Qu'Allah vous bénisse","Bienvenue chez moi"],"« As-Salâm », la Paix, est aussi l'un des noms d'Allah."],
["culture",1,"Comment s'appelle le lieu de prière des musulmans ?","La mosquée (masjid)",["La medersa","Le hammam","La zaouïa"],"« Masjid » veut dire « le lieu où l'on se prosterne »."],
["culture",1,"Que signifie « halâl » ?","Permis, licite",["Interdit","Recommandé","Sacré"],"Son contraire est « harâm », interdit."],
["culture",1,"Quelle viande est interdite aux musulmans ?","Le porc",["Le bœuf","Le poulet","Le mouton"],"Il est interdit dans le Coran (2:173), sauf en cas de nécessité absolue."],
["culture",1,"Combien y a-t-il de grandes fêtes (ʿîd) dans l'année ?","2",["1","3","5"],"Dans le hadith, le vendredi est aussi appelé une fête de la semaine (Ibn Mâja)."],
["culture",1,"Selon le hadith, combien de noms d'Allah ouvrent le Paradis à celui qui les retient ?","99",["33", "40", "100"],"Allah a d'autres noms qu'Il garde dans Sa science : le hadith ne les limite pas à 99."],
["culture",2,"Que signifie « Ar-Rahmân » ?","Le Tout Miséricordieux",["Le Tout Puissant","L'Unique","Le Créateur"],"Il vient de « rahma », la miséricorde. Ar-Rahîm, le Très Miséricordieux, en est proche."],
["adab",1,"Sur quel côté le Prophète ﷺ recommandait-il de se coucher pour dormir ?","Le côté droit",["Le côté gauche","Sur le ventre","Sur le dos"],"Avec l'invocation « Bismika Llâhumma amûtu wa ahyâ » (Bukhârî)."],
["adab",1,"Avec quoi le Prophète ﷺ rompait-il son jeûne de préférence ?","Des dattes, sinon de l'eau",["Du lait","Du pain","Du miel"],"Il prenait des dattes fraîches, sinon sèches, sinon quelques gorgées d'eau (Abû Dâwûd, Tirmidhî)."],
["adab",1,"Quel bâtonnet le Prophète ﷺ utilisait-il pour se nettoyer les dents ?","Le siwâk",["Le khôl","Le misbaha","Le henné"],"« Si je ne craignais pas de surcharger ma communauté, je leur aurais ordonné le siwâk à chaque prière » (Bukhârî, Muslim)."],
["adab",1,"Par quel côté le Prophète ﷺ aimait-il commencer pour se chausser, se peigner et se purifier ?","Par la droite",["Par la gauche","Peu importe","Par le côté le plus proche"],"Rapporté par ʿÂ'icha (Bukhârî, Muslim)."],
["adab",1,"Selon le hadith, la pudeur (al-hayâ') fait partie…","… de la foi",["… de la faiblesse","… de la timidité, à corriger","… des coutumes arabes"],"Bukhârî et Muslim."],
["adab",1,"Que faire quand on entend l'appel à la prière (adhân) ?","Répéter les paroles du muezzin",["Continuer à parler","Monter le son de la musique","Rien de particulier"],"À « hayya ʿalâ s-salâh » et « hayya ʿalâ l-falâh », on dit « lâ hawla wa lâ quwwata illâ billâh » (Bukhârî, Muslim)."],
["adab",2,"Comment le Prophète ﷺ buvait-il ?","En trois fois, en respirant hors du récipient",["D'une seule traite","En soufflant dans le verre pour le refroidir","De la main gauche"],"Il a interdit de souffler ou de respirer dans le récipient (Bukhârî, Muslim)."],
["adab",2,"Quelle invocation dit-on en entrant dans la mosquée ?","« Allâhumma ftah lî abwâba rahmatik »",["« Allâhumma innî as'aluka min fadlik »","« Subhâna rabbiya l-aʿlâ »","« Rabbanâ âtinâ fî d-dunyâ hasana »"],"En sortant, on dit « Allâhumma innî as'aluka min fadlik » (Muslim)."],
["adab",2,"Après chaque prière, que dit-on 33 fois chacun selon la sunna ?","Subhânallâh, Alhamdulillâh, Allâhu akbar",["Bismillâh, Inchâ'Allâh, Mâ châ' Allâh","Astaghfirullâh, Âmîn, Bismillâh","Allâhu akbar seulement, 99 fois"],"On complète la centaine par « Lâ ilâha illâ Llâhu wahdahu lâ charîka lah… » (Muslim)."],
["adab",2,"Selon le hadith, quel est le meilleur rappel d'Allah (dhikr) ?","« Lâ ilâha illâ Llâh »",["« Subhânallâh »","« Mâ châ' Allâh »","« Bismillâh »"],"« Le meilleur dhikr est lâ ilâha illâ Llâh, et la meilleure invocation est alhamdulillâh » (Tirmidhî)."],
["adab",2,"Comment le Prophète ﷺ mangeait-il ?","Avec trois doigts de la main droite, puis il se léchait les doigts",["Avec la main gauche","Debout en marchant","Très vite, sans parler à personne"],"Il a dit : « vous ne savez pas dans quelle partie de votre nourriture se trouve la baraka » (Muslim)."],
["adab",2,"Selon la sunna, qui doit saluer en premier ?","Le plus jeune salue le plus âgé, celui qui marche salue celui qui est assis",["Toujours le plus âgé","Celui qui a le plus de savoir","Celui qui est le plus riche"],"Et le petit groupe salue le grand groupe (Bukhârî)."],
["adab",2,"Tu fais un mauvais rêve. Que recommande la sunna ?","Demander la protection d'Allah et ne le raconter à personne",["Le raconter à tout le monde","Le noter pour le faire interpréter","Ne plus dormir de la nuit"],"On souffle légèrement trois fois à sa gauche et on change de côté (Muslim)."],
["adab",2,"Selon le hadith, la purification (at-tuhûr), c'est…","… la moitié de la foi",["… un simple détail","… réservée au vendredi","… le quart de la prière"],"Muslim."],
["adab",2,"Il se met à pleuvoir. Que disait le Prophète ﷺ ?","« Allâhumma sayyiban nâfiʿâ » (une pluie bénéfique)",["« Innâ lillâhi wa innâ ilayhi râjiʿûn »","« Astaghfirullâh »","Rien, il rentrait vite"],"Bukhârî."],
["adab",3,"Quelle prière surérogatoire le Prophète ﷺ ne délaissait jamais, même en voyage ?","Les 2 rakʿa avant le Fajr",["Les 4 rakʿa avant le ʿAsr","La prière du duhâ","Les 2 rakʿa après le Maghrib"],"« Elles valent mieux que ce bas monde et ce qu'il contient » (Muslim). Il ne délaissait pas non plus le witr."],
["adab",3,"Selon le hadith, quelles trois choses profitent encore au défunt après sa mort ?","Une aumône continue, un savoir utile, un enfant pieux qui invoque pour lui",["Sa maison, son argent, sa voiture","Sa réputation, ses amis, sa tombe","Ses photos, ses habits, ses livres"],"Muslim."],
["piliers",2,"Quels jours de la semaine le Prophète ﷺ jeûnait-il souvent ?","Le lundi et le jeudi",["Le vendredi et le samedi","Le mardi et le mercredi","Le dimanche seulement"],"« Les actes sont présentés à Allah ces jours-là » (Tirmidhî). Jeûner le vendredi seul est déconseillé."],
["piliers",2,"Combien de jours de Chawwâl est-il recommandé de jeûner après le Ramadan ?","6 jours",["3 jours","10 jours","Tout le mois"],"« Comme s'il avait jeûné toute l'année » (Muslim)."],
["piliers",3,"Quel jeûne volontaire efface les péchés de l'année passée et de l'année suivante ?","Le jeûne du jour de ʿArafa",["Le jeûne de ʿÂchûrâ'","Le jeûne du 27 Ramadan","Le jeûne du vendredi"],"Le jeûne de ʿÂchûrâ' efface ceux de l'année passée (Muslim). Il n'est pas recommandé pour le pèlerin à ʿArafa."],
["sira",1,"Que faisait le Prophète ﷺ chez lui ?","Il aidait sa famille dans les tâches de la maison",["Il ne faisait rien","Il donnait seulement des ordres","Il ne rentrait que pour dormir"],"ʿÂ'icha : il raccommodait ses habits, réparait ses sandales et servait sa famille (Bukhârî, Ahmad)."],
["sira",1,"Comment le Prophète ﷺ se comportait-il avec les enfants ?","Il les saluait et jouait avec eux avec douceur",["Il les ignorait","Il était toujours sévère","Il ne leur parlait jamais"],"Anas raconte qu'il saluait les enfants en passant (Bukhârî, Muslim)."],
["sira",2,"Le Prophète ﷺ a-t-il déjà frappé une femme ou un serviteur ?","Jamais",["Une seule fois","Quand il était en colère","Seulement les serviteurs"],"ʿÂ'icha : il n'a jamais frappé de sa main ni femme ni serviteur (Muslim)."],
["sira",2,"Anas a servi le Prophète ﷺ dix ans. Que dit-il de son comportement ?","Il ne lui a jamais dit « ouf ! » ni reproché quoi que ce soit",["Il le grondait souvent","Il ne lui parlait presque pas","Il le punissait en cas d'erreur"],"Bukhârî et Muslim."],

["histoire", 1, "Quelle ville est appelée « la ville illuminée » (Al-Madîna al-Munawwara) ?", "Médine", ["La Mecque", "Jérusalem", "Damas"], "Avant l'Hégire, elle s'appelait Yathrib."],
["histoire", 1, "Combien y a-t-il eu de califes « bien guidés » ?", "4", ["3", "5", "12"], "Abû Bakr, ʿUmar, ʿUthmân et ʿAlî."],
["histoire", 1, "Lors de la conquête de La Mecque, qu'a fait le Prophète ﷺ des idoles autour de la Kaʿba ?", "Il les a détruites", ["Il les a gardées", "Il les a vendues", "Il les a enterrées sous la Kaʿba"], "Il récitait : « La vérité est venue et le faux a disparu » (17:81) (Bukhârî, Muslim)."],
["histoire", 1, "Lors de la conquête de La Mecque, comment le Prophète ﷺ a-t-il traité les Quraych qui l'avaient combattu ?", "Il leur a pardonné", ["Il les a tous punis", "Il les a chassés de La Mecque", "Il a pris tous leurs biens"], "Selon les livres de sîra, il leur dit : « Allez, vous êtes libres. »"],
["histoire", 1, "Combien d'années environ le Prophète ﷺ a-t-il vécu à Médine après l'Hégire ?", "10 ans", ["3 ans", "20 ans", "40 ans"], "De 622 jusqu'à son décès en 632."],
["histoire", 1, "Dans quelle ville se trouve le Dôme du Rocher ?", "Jérusalem", ["La Mecque", "Médine", "Le Caire"], "Il a été construit vers 691, sur l'esplanade d'Al-Aqsâ."],
["histoire", 1, "Depuis quelle ville gouvernaient Abû Bakr, ʿUmar et ʿUthmân ?", "Médine", ["La Mecque", "Damas", "Bagdad"], "ʿAlî s'installa ensuite à Koufa, en Irak."],
["histoire", 1, "Quel pays d'Europe a été en grande partie musulman pendant près de 800 ans ?", "L'Espagne", ["L'Angleterre", "La Suède", "La Pologne"], "On l'appelait Al-Andalus (711-1492)."],
["prophetes", 1, "Quel prophète a parlé alors qu'il était encore bébé, dans son berceau ?", "ʿÎsâ (Jésus)", ["Mûsâ (Moïse)", "Yahyâ (Jean)", "Sulaymân (Salomon)"], "Le Coran le raconte dans la sourate Maryam (19:29-30)."],
["prophetes", 1, "Combien de fils le prophète Yaʿqûb avait-il ?", "12", ["3", "7", "10"], "Yûsuf et son frère Binyâmîn faisaient partie des douze."],
["prophetes", 1, "Quel prophète avait un bâton qui se transformait en serpent ?", "Mûsâ (Moïse)", ["Ibrâhîm", "Nûh (Noé)", "Hûd"], "Sourate Tâ-Hâ (20:17-21)."],
["prophetes", 1, "Selon le Coran, quel prophète n'a été ni tué ni crucifié, mais élevé par Allah vers Lui ?", "ʿÎsâ (Jésus)", ["Yahyâ (Jean)", "Mûsâ (Moïse)", "Yûnus (Jonas)"], "Sourate An-Nisâ' (4:157-158)."],
["prophetes", 1, "Quel prophète était le fils de Zakariyyâ ?", "Yahyâ (Jean)", ["ʿÎsâ (Jésus)", "Yûsuf (Joseph)", "Ismâʿîl"], "Allah l'a annoncé à Zakariyyâ alors qu'il était âgé (19:7-9)."],
["prophetes", 1, "Quel fils d'Ibrâhîm est l'ancêtre du Prophète Muhammad ﷺ ?", "Ismâʿîl", ["Ishâq (Isaac)", "Yaʿqûb (Jacob)", "Lût (Loth)"], "Sa mère s'appelait Hâjar ; la source de Zamzam a jailli pour eux à La Mecque."],
["culture", 1, "Comment s'appelle la grande mosquée qui entoure la Kaʿba ?", "Al-Masjid al-Harâm", ["Al-Masjid an-Nabawî", "Al-Aqsâ", "La mosquée de Qubâ'"], "Une prière y vaut cent mille prières ailleurs (Ahmad, Ibn Mâja)."],
["culture", 1, "Que signifie « Mâ châ' Allâh » ?", "Ce qu'Allah a voulu", ["Si Allah le veut", "Merci Allah", "Allah est grand"], "On le dit quand on voit quelque chose de beau ou de réussi (voir sourate Al-Kahf, 18:39)."],
["culture", 1, "Que signifie « Astaghfirullâh » ?", "Je demande pardon à Allah", ["Je remercie Allah", "Allah est le plus grand", "Gloire à Allah"], "Le Prophète ﷺ demandait pardon à Allah plus de soixante-dix fois par jour (Bukhârî)."],
["culture", 1, "Comment s'appelle la pierre noire encastrée dans un angle de la Kaʿba ?", "Al-Hajar al-Aswad", ["Maqâm Ibrâhîm", "Zamzam", "Al-Hijr"], "Les pèlerins commencent chaque tour du tawâf à son niveau."],
["culture", 1, "Comment appelle-t-on celui qui dirige la prière en commun ?", "L'imam", ["Le muezzin", "Le calife", "Le cadi"], "L'imam se place devant ; les fidèles le suivent sans le devancer."],
["coran", 1, "Quelle sourate commence par « Qul aʿûdhu bi-rabbi l-falaq » ?", "Al-Falaq", ["An-Nâs", "Al-Ikhlâs", "Al-Kâfirûn"], "Avec An-Nâs, on les appelle « al-muʿawwidhatân », les deux sourates de protection."],
["coran", 1, "Quel verset récite-t-on avant de dormir pour être protégé jusqu'au matin ?", "Âyat al-Kursî", ["Le premier verset d'Al-Baqara", "Le dernier verset d'An-Nâs", "Le premier verset de Yâ-Sîn"], "Hadith d'Abû Hurayra rapporté par Bukhârî."],
["coran", 1, "Le Coran est la parole de…", "Allah", ["Jibrîl", "Muhammad ﷺ", "Des savants"], "Jibrîl l'a transmis et le Prophète ﷺ l'a communiqué, mais c'est la parole d'Allah."],
["coran", 1, "Comment s'appelle la récitation du Coran avec ses règles de prononciation ?", "Le tajwîd", ["Le tafsîr", "Le hadith", "Le fiqh"], "Le tafsîr, lui, est l'explication du sens du Coran."],
["sira", 1, "Quel métier le Prophète ﷺ a-t-il exercé dans sa jeunesse, autour de La Mecque ?", "Berger", ["Forgeron", "Pêcheur", "Charpentier"], "Il gardait des moutons pour les gens de La Mecque ; tous les prophètes ont été bergers (Bukhârî)."],
["sira", 1, "Pendant combien d'années le Prophète ﷺ a-t-il appelé à l'islam à La Mecque avant l'Hégire ?", "13 ans", ["3 ans", "23 ans", "40 ans"], "Puis 10 ans à Médine : 23 ans de révélation au total."],
["sira", 1, "Sur quelle monture le Prophète ﷺ a-t-il fait le voyage nocturne vers Jérusalem ?", "Al-Burâq", ["Al-Qaswâ'", "Un aigle géant", "Un chameau blanc"], "Une monture blanche, plus grande qu'un âne et plus petite qu'une mule (Muslim)."],
["sira", 1, "Combien de filles le Prophète ﷺ a-t-il eues ?", "4", ["1", "2", "7"], "Zaynab, Ruqayya, Umm Kulthûm et Fâtima, toutes filles de Khadîja."],
["piliers", 1, "Que dit-on pour terminer la prière, en tournant la tête à droite puis à gauche ?", "« As-salâmu ʿalaykum wa rahmatullâh »", ["« Allâhu akbar »", "« Âmîn »", "« Subhânallâh »"], "C'est le taslîm (Abû Dâwûd, Tirmidhî)."],
["piliers", 1, "Que dit-on après la récitation d'Al-Fâtiha ?", "« Âmîn »", ["« Allâhu akbar »", "« Bismillâh »", "« Alhamdulillâh »"], "« Âmîn » signifie « Ô Allah, exauce ». Celui dont le âmîn coïncide avec celui des anges est pardonné (Bukhârî, Muslim)."],
["piliers", 1, "Par quoi commence-t-on les ablutions, après l'intention et « Bismillâh » ?", "Se laver les mains", ["Se laver les pieds", "Se passer les mains mouillées sur la tête", "Se laver les oreilles"], "Puis on se rince la bouche et le nez, et on se lave le visage."],
["coran", 1, "Que signifie « Al-Qamar », le nom de la sourate 54 ?", "La lune", ["Le soleil", "L'étoile", "Le ciel"], "Elle commence par l'évocation de la lune qui s'est fendue (54:1)."],
["coran", 1, "Que signifie « Ach-Chams », le nom de la sourate 91 ?", "Le soleil", ["La lune", "L'aube", "La nuit"], "Elle commence par un serment d'Allah sur le soleil et sa clarté (91:1)."],
["coran", 1, "Quelle sourate commence par « Qul aʿûdhu bi-rabbi n-nâs » ?", "An-Nâs", ["Al-Falaq", "Al-Ikhlâs", "Al-Kâfirûn"], "C'est la sourate 114, une demande de protection auprès du Seigneur des hommes."],
["coran", 1, "Combien de versets compte la sourate Al-Ikhlâs ?", "4", ["3", "5", "7"], "Ces 4 courts versets résument l'unicité d'Allah (sourate 112)."],
["coran", 1, "Comment appelle-t-on la formule « Bismillâh ar-Rahmân ar-Rahîm » ?", "La basmala", ["La chahâda", "Le takbîr", "La talbiya"], "Elle se trouve en tête de 113 sourates sur 114."],
["coran", 1, "Que signifie « An-Nisâ' », le nom de la sourate 4 ?", "Les femmes", ["Les enfants", "Les mères", "Les croyants"], "Elle parle notamment des droits des femmes, des orphelins et de la famille."],
["coran", 1, "Selon le hadith, « le meilleur d'entre vous est celui qui apprend le Coran et… »", "… l'enseigne", ["… le récite la nuit", "… le copie à la main", "… l'écoute en voiture"], "Hadith rapporté par al-Bukhârî."],
["coran", 1, "Selon la sourate Al-Qadr, la Nuit du Destin est meilleure que combien de mois ?", "1000", ["100", "70", "12"], "« La Nuit du Destin est meilleure que mille mois » (97:3)."],
["coran", 1, "Quelle sourate porte le nom des djinns ?", "Al-Jinn", ["Al-Falaq", "Al-Kahf", "Ar-Raʿd"], "C'est la sourate 72 : elle raconte comment des djinns ont écouté le Coran et ont cru."],
["coran", 1, "Quelle sourate porte le nom du vendredi ?", "Al-Jumuʿa", ["Al-Fajr", "Ad-Duhâ", "Al-ʿAsr"], "C'est la sourate 62 : elle appelle les croyants à se rendre à la prière du vendredi (62:9)."],
["coran", 2, "Que signifie « Al-ʿAsr », le nom de la sourate 103 ?", "Le temps", ["La lumière", "La patience", "La vérité"], "Allah y jure par le temps : l'homme est perdant, sauf ceux qui croient et font le bien."],
["coran", 2, "Combien de versets compte la sourate Al-Kawthar ?", "3", ["4", "5", "6"], "C'est la plus courte sourate du Coran (sourate 108)."],
["coran", 2, "Quelle sourate commence par « Tabâraka lladhî bi-yadihi l-mulk » ?", "Al-Mulk", ["Al-Hadîd", "Al-Hujurât", "Al-Mujâdala"], "C'est la sourate 67, qui compte 30 versets."],
["coran", 2, "Quelle sourate parle d'Abû Lahab et de sa femme ?", "Al-Masad", ["Al-Humaza", "Al-Fîl", "Quraych"], "Sourate 111, aussi appelée « Tabbat ». Abû Lahab était un oncle du Prophète ﷺ hostile à l'islam."],
["coran", 2, "Selon le hadith, Satan fuit la maison où l'on récite quelle sourate ?", "Al-Baqara", ["Al-Kahf", "Yâ-Sîn", "Al-Mulk"], "Hadith rapporté par Muslim : « Ne faites pas de vos maisons des tombes. »"],
["coran", 2, "Selon le Coran (7:54), en combien de jours Allah a-t-il créé les cieux et la terre ?", "6", ["7", "3", "40"], "Ce nombre est mentionné dans plusieurs versets, dont 7:54."],
["coran", 2, "Comment appelle-t-on l'explication (l'exégèse) du Coran ?", "Le tafsîr", ["Le tajwîd", "Le fiqh", "Le hadith"], "Le tafsîr explique le sens des versets et le contexte de leur révélation."],
["coran", 2, "Quelle sourate rapporte les conseils d'un sage à son fils ?", "Luqmân", ["Yûsuf", "Maryam", "Al-Kahf"], "Il lui conseille de ne rien associer à Allah, d'accomplir la prière et de rester humble (31:13-19)."],
["coran", 2, "Comment s'appelle la 30e et dernière partie du Coran, souvent apprise en premier par les enfants ?", "Juz' ʿAmma", ["Juz' Tabâraka", "Juz' Alif Lâm Mîm", "Juz' Yâ-Sîn"], "Elle commence par la sourate An-Naba' (« ʿAmma yatasâ'alûn ») et contient beaucoup de sourates courtes."],
["coran", 3, "Comment le Coran appelle-t-il les oiseaux envoyés contre l'armée de l'éléphant ?", "Abâbîl", ["Hudhud", "Ghurâb", "Nusûr"], "Ce mot désigne des oiseaux arrivant par groupes successifs (105:3)."],
["coran", 3, "Selon le hadith, quelles sourates sont appelées « les deux lumineuses » (az-zahrâwân) ?", "Al-Baqara et Âl ʿImrân", ["Al-Falaq et An-Nâs", "Al-Fâtiha et Al-Ikhlâs", "Al-Kahf et Maryam"], "Hadith rapporté par Muslim : elles viendront au Jour dernier défendre ceux qui les récitaient."],
["coran", 3, "Selon le hadith, apprendre les 10 premiers versets de quelle sourate protège du Dajjâl ?", "Al-Kahf", ["Yâ-Sîn", "Al-Mulk", "Al-Baqara"], "Hadith rapporté par Muslim."],
["coran", 3, "Combien de sourates commencent par le mot « Qul » (Dis) ?", "5", ["3", "4", "7"], "Al-Jinn, Al-Kâfirûn, Al-Ikhlâs, Al-Falaq et An-Nâs."],
["coran", 3, "Quelle sourate porte le nom d'un métal ?", "Al-Hadîd (le fer)", ["Al-Qalam (la plume)", "At-Tûr (le mont)", "Ar-Raʿd (le tonnerre)"], "C'est la sourate 57 : Allah y dit avoir fait descendre le fer, qui contient une grande force et des utilités (57:25)."],
["coran", 3, "Dans quelle sourate est racontée la rencontre entre Sulaymân et la reine de Saba ?", "An-Naml", ["Saba'", "Sâd", "Al-Anbiyâ'"], "La huppe lui apporte la nouvelle de cette reine et de son peuple (27:20-44)."],
["coran", 3, "Que signifie « Al-Furqân », le nom de la sourate 25 ?", "Le discernement", ["La lumière", "La guidance", "La miséricorde"], "C'est aussi un nom du Coran, car il permet de distinguer le vrai du faux (25:1)."],
["sira", 1, "Que signifie le nom « Muhammad » ?", "Celui qui est loué", ["Le fidèle", "Le victorieux", "Le patient"], "Il vient du même mot que « hamd », la louange, comme son autre nom Ahmad."],
["sira", 1, "Comment s'appellent les habitants de Médine qui ont accueilli et aidé le Prophète ﷺ ?", "Les Ansâr", ["Les Muhâjirûn", "Les Tâbiʿûn", "Les Hawâriyyûn"], "« Ansâr » signifie « les soutiens » ; le Coran les loue pour leur générosité (59:9)."],
["sira", 1, "Comment appelle-t-on les musulmans qui ont émigré de La Mecque vers Médine ?", "Les Muhâjirûn", ["Les Ansâr", "Les Tâbiʿûn", "Les Hawâriyyûn"], "Ils ont quitté leurs maisons et leurs biens pour pouvoir vivre leur foi."],
["sira", 1, "Comment s'appelle l'ascension du Prophète ﷺ à travers les cieux ?", "Al-Miʿrâj", ["Al-Isrâ'", "Al-Hijra", "Al-Fath"], "Elle a suivi le voyage nocturne de La Mecque à Jérusalem (Bukhârî, Muslim)."],
["sira", 1, "Qui fut la toute première personne à croire au message du Prophète ﷺ ?", "Khadîja", ["Abû Bakr", "ʿAlî", "Zayd ibn Hâritha"], "Elle l'a rassuré et soutenu dès la première révélation (Bukhârî)."],
["sira", 1, "Que faisait le Prophète ﷺ dans la grotte de Hirâ' avant la révélation ?", "Il s'y retirait pour adorer Allah", ["Il y gardait ses moutons", "Il y cachait ses marchandises", "Il y apprenait à lire"], "Il y passait plusieurs nuits à prier, selon le hadith de ʿÂ'icha (Bukhârî)."],
["sira", 1, "Le Prophète ﷺ a-t-il aidé à construire sa mosquée à Médine ?", "Oui, il portait lui-même des briques", ["Non, il regardait les travaux", "Non, des ouvriers étrangers l'ont faite", "Non, elle existait déjà"], "Il travaillait avec ses compagnons en portant des briques (Bukhârî)."],
["sira", 1, "Quel cousin du Prophète ﷺ a dormi dans son lit la nuit de l'Hégire ?", "ʿAlî", ["Jaʿfar", "Abû Bakr", "ʿUthmân"], "Il a aussi rendu aux Mecquois les biens qu'ils avaient confiés au Prophète ﷺ."],
["sira", 1, "Vers quelle ville les musulmans se tournaient-ils pour prier avant que la qibla devienne la Kaʿba ?", "Jérusalem", ["Médine", "Damas", "Taïf"], "Pendant 16 ou 17 mois après l'Hégire (Bukhârî), avant la révélation du verset 2:144."],
["sira", 1, "Que mangeait souvent la famille du Prophète ﷺ pendant des semaines entières ?", "Des dattes et de l'eau", ["De la viande grillée", "Du pain blanc et du miel", "Du riz et du poulet"], "ʿÂ'icha raconte que deux mois pouvaient passer sans qu'on allume le feu chez eux (Bukhârî, Muslim)."],
["sira", 2, "Dans quelle grotte le Prophète ﷺ et Abû Bakr se sont-ils cachés pendant l'Hégire ?", "La grotte de Thawr", ["La grotte de Hirâ'", "La grotte de Qubâ'", "La grotte de Taïf"], "Ils y restèrent 3 nuits, au sud de La Mecque, avant de partir vers Médine (Bukhârî)."],
["sira", 2, "Dans la grotte, que dit le Prophète ﷺ à Abû Bakr, selon le Coran (9:40) ?", "« Ne t'afflige pas, Allah est avec nous »", ["« Partons vite d'ici »", "« Cachons-nous plus loin »", "« Appelle les Ansâr »"], "Le verset 9:40 rappelle ce moment de confiance totale en Allah."],
["sira", 2, "Quel cousin de Khadîja, connaisseur des Écritures, a confirmé que le Prophète ﷺ recevait la révélation ?", "Waraqa ibn Nawfal", ["Abû Sufyân", "Al-ʿAbbâs", "Abû Jahl"], "Il dit que c'était le même ange venu à Mûsâ (Bukhârî)."],
["sira", 2, "Sur quelle colline de La Mecque le Prophète ﷺ a-t-il appelé publiquement sa tribu à l'islam ?", "As-Safâ", ["Le mont Uhud", "Le mont Thawr", "Le mont ʿArafât"], "Il appela les clans de Quraych pour les avertir (Bukhârî)."],
["sira", 2, "Avant la prophétie, quel différend le Prophète ﷺ a-t-il réglé lors de la reconstruction de la Kaʿba ?", "Qui poserait la Pierre noire", ["Qui garderait les clés", "Qui paierait les travaux", "Qui choisirait les pierres"], "Il posa la pierre sur un manteau que chaque clan souleva, puis la mit lui-même en place."],
["sira", 2, "Pendant quel mois a eu lieu la bataille de Badr ?", "Ramadan", ["Muharram", "Chawwâl", "Rajab"], "Elle eut lieu le 17 Ramadan de l'an 2 de l'Hégire."],
["sira", 2, "Qu'a fait le Prophète ﷺ entre les Ansâr et les Muhâjirûn à son arrivée à Médine ?", "Il les a unis comme des frères", ["Il les a séparés en deux quartiers", "Il a renvoyé les Muhâjirûn", "Il les a mis en compétition"], "Chaque Ansârî partageait sa maison et ses biens avec son frère émigré (Bukhârî)."],
["sira", 2, "Selon le hadith, que dit le Prophète ﷺ de la montagne Uhud ?", "Elle nous aime et nous l'aimons", ["Elle est la plus haute du monde", "Elle est faite d'or", "Il ne faut jamais y monter"], "Hadith rapporté par al-Bukhârî et Muslim."],
["sira", 2, "Après Taïf, l'ange des montagnes proposa d'écraser les habitants. Qu'a souhaité le Prophète ﷺ ?", "Que leurs descendants adorent Allah", ["Qu'ils soient punis", "Qu'ils quittent leur ville", "Ne plus jamais les revoir"], "Un exemple de sa grande miséricorde (Bukhârî, Muslim)."],
["sira", 3, "Quel cavalier a poursuivi le Prophète ﷺ pendant l'Hégire avant que son cheval ne s'enfonce dans le sol ?", "Surâqa ibn Mâlik", ["Khâlid ibn al-Walîd", "Abû Jahl", "ʿIkrima"], "Il renonça à sa poursuite et devint plus tard musulman (Bukhârî)."],
["sira", 3, "Quelle fille d'Abû Bakr fut surnommée « celle aux deux ceintures » pendant l'Hégire ?", "Asmâ'", ["ʿÂ'icha", "Hafsa", "Sumayya"], "Elle coupa sa ceinture en deux pour attacher les provisions du voyage (Bukhârî)."],
["sira", 3, "Quelle bataille contre la tribu de Hawâzin, en l'an 8, est citée dans le Coran (9:25) ?", "Hunayn", ["Tabûk", "Khaybar", "Mu'ta"], "Le Coran rappelle que le grand nombre des musulmans ne leur avait servi à rien sans l'aide d'Allah."],
["sira", 3, "Quelle expédition le Prophète ﷺ a-t-il menée en l'an 9, par une grande chaleur, vers le nord ?", "Tabûk", ["Hunayn", "Khaybar", "Badr"], "La sourate At-Tawba évoque cette expédition difficile."],
["sira", 3, "Que voyait ʿÂ'icha sur le front du Prophète ﷺ pendant la révélation, même par grand froid ?", "De la sueur", ["De la poussière", "Des gouttes de pluie", "Une marque rouge"], "Elle le décrit dans le hadith qui ouvre le Sahîh d'al-Bukhârî."],
["sira", 3, "Quel empereur byzantin a reçu une lettre du Prophète ﷺ l'appelant à l'islam ?", "Héraclius", ["Justinien", "Constantin", "Théodose"], "Il interrogea Abû Sufyân sur le Prophète ﷺ (Bukhârî)."],
["sira", 3, "Avec quoi le Prophète ﷺ scellait-il ses lettres aux rois ?", "Une bague en argent", ["Un sceau en or", "Une pierre gravée", "Une empreinte de son pouce"], "Elle portait l'inscription « Muhammad Rasûl Allâh » (Bukhârî)."],
["prophetes", 1, "Selon le Coran, quel animal a montré à un fils d'Âdam comment enterrer son frère ?", "Un corbeau", ["Une colombe", "Un aigle", "Une huppe"], "Récit de la sourate Al-Mâ'ida (5:31)."],
["prophetes", 1, "De quoi Allah a-t-il créé Âdam ?", "D'argile", ["De lumière", "De feu", "De pierre"], "Les anges ont été créés de lumière et les djinns de feu (Muslim)."],
["prophetes", 1, "Comment s'appelle l'épouse d'Âdam ?", "Hawwâ' (Ève)", ["Maryam", "Sâra", "Hâjar"], "Le Coran ne la nomme pas ; son nom est connu par la Sunna (Bukhârî)."],
["prophetes", 1, "Qui a refusé, par orgueil, de se prosterner devant Âdam ?", "Iblîs", ["Jibrîl", "Mîkâ'îl", "Qârûn"], "Le Coran précise qu'il faisait partie des djinns (18:50)."],
["prophetes", 1, "Quel prophète a cassé les idoles de son peuple, sauf la plus grande ?", "Ibrâhîm", ["Mûsâ", "Nûh", "Hûd"], "Il voulait leur montrer que ces idoles ne pouvaient ni parler ni se défendre (21:58-63)."],
["prophetes", 1, "Quel prophète a vu en rêve 11 étoiles, le soleil et la lune se prosterner devant lui ?", "Yûsuf", ["Yaʿqûb", "Sulaymân", "Dâwûd"], "Ce rêve d'enfance se réalisa des années plus tard en Égypte (12:4 et 12:100)."],
["prophetes", 1, "Quel prophète a été déposé bébé dans un coffre sur le fleuve par sa mère ?", "Mûsâ", ["Yûsuf", "ʿÎsâ", "Ismâʿîl"], "Allah avait inspiré à sa mère de le faire pour le protéger (20:38-39)."],
["prophetes", 1, "Quel prophète guérissait l'aveugle-né et le lépreux, par la permission d'Allah ?", "ʿÎsâ (Jésus)", ["Mûsâ (Moïse)", "Ayyûb (Job)", "Sulaymân (Salomon)"], "Ces miracles sont cités dans la sourate Âl ʿImrân (3:49)."],
["prophetes", 1, "Où vivaient Âdam et son épouse avant de descendre sur Terre ?", "Au Paradis", ["À La Mecque", "À Jérusalem", "En Égypte"], "Ils en sortirent après avoir mangé de l'arbre interdit, puis Allah accepta leur repentir (2:35-37)."],
["prophetes", 1, "Qui est la mère du prophète Ismâʿîl ?", "Hâjar", ["Sâra", "Maryam", "Âsiya"], "Ibrâhîm la laissa avec son bébé dans la vallée de La Mecque, confiante en Allah (Bukhârî)."],
["prophetes", 2, "Quelle invocation Yûnus a-t-il faite dans le ventre du poisson ?", "« Lâ ilâha illâ anta, subhânaka… »", ["« Rabbanâ âtinâ fi d-dunyâ… »", "« Hasbunâ Llâhu wa niʿma l-wakîl »", "« Rabbi zidnî ʿilmâ »"], "« … innî kuntu mina z-zâlimîn » (21:87) ; Allah l'a sauvé de l'angoisse."],
["prophetes", 2, "Quel prophète travaillait le fer pour fabriquer des cottes de mailles ?", "Dâwûd (David)", ["Sulaymân (Salomon)", "Nûh (Noé)", "Idrîs"], "Allah avait rendu le fer souple pour lui (34:10-11)."],
["prophetes", 2, "Pour les disciples de quel prophète une table servie est-elle descendue du ciel ?", "ʿÎsâ (Jésus)", ["Mûsâ (Moïse)", "Sulaymân (Salomon)", "Ibrâhîm"], "La sourate Al-Mâ'ida (la table servie) tire son nom de ce récit (5:112-115)."],
["prophetes", 2, "Comment le Coran appelle-t-il les disciples de ʿÎsâ ?", "Al-Hawâriyyûn", ["Al-Muhâjirûn", "Ahl al-Kahf", "Al-Asbât"], "Ils répondirent : « Nous sommes les soutiens d'Allah » (3:52)."],
["prophetes", 2, "Au pied de quel arbre Maryam a-t-elle donné naissance à ʿÎsâ ?", "Un palmier", ["Un olivier", "Un figuier", "Un cèdre"], "Allah lui dit de secouer le tronc pour faire tomber des dattes fraîches (19:23-25)."],
["prophetes", 2, "Quel prophète est aussi appelé « Isrâ'îl » ?", "Yaʿqûb (Jacob)", ["Ishâq (Isaac)", "Ibrâhîm", "Yûsuf (Joseph)"], "Ses descendants sont appelés les Banû Isrâ'îl, les enfants d'Israël (3:93)."],
["prophetes", 2, "Pour quel enfant, futur prophète, la source de Zamzam a-t-elle jailli ?", "Ismâʿîl", ["Ishâq", "Mûsâ", "Yahyâ"], "Sa mère courait chercher de l'eau quand l'ange fit jaillir la source (Bukhârî)."],
["prophetes", 2, "Selon le Coran, combien de nuits a duré le rendez-vous de Mûsâ avec son Seigneur ?", "40", ["30", "7", "100"], "30 nuits, complétées par 10 autres (7:142)."],
["prophetes", 2, "Quel prophète a demandé à Allah de lui montrer comment Il redonne vie aux morts ?", "Ibrâhîm", ["Nûh (Noé)", "Zakariyyâ", "Hûd"], "Allah lui ordonna de prendre quatre oiseaux, qui revinrent vers lui (2:260)."],
["prophetes", 3, "Sur quel mont l'arche de Nûh s'est-elle posée, selon le Coran ?", "Al-Jûdî", ["Uhud", "Le Sinaï", "ʿArafât"], "Cité dans la sourate Hûd (11:44)."],
["prophetes", 3, "Selon le Coran, combien de signes évidents Mûsâ a-t-il reçus ?", "9", ["7", "10", "12"], "Mentionné dans la sourate Al-Isrâ' (17:101), dont le bâton et la main brillante."],
["prophetes", 3, "Qui a fabriqué le veau d'or adoré par les Banû Isrâ'îl ?", "As-Sâmirî", ["Qârûn", "Hâmân", "Pharaon"], "Il l'a fait pendant que Mûsâ était à son rendez-vous avec Allah (20:85-88)."],
["prophetes", 3, "Selon le hadith, quel prophète exerçait le métier de charpentier ?", "Zakariyyâ", ["Dâwûd (David)", "Hûd", "Sâlih"], "Hadith rapporté par Muslim : les prophètes vivaient du travail de leurs mains."],
["prophetes", 3, "Selon le hadith, comment jeûnait Dâwûd, dont le jeûne est le plus aimé d'Allah ?", "Un jour sur deux", ["Tous les lundis", "Un mois par an", "Tous les jours"], "Hadith rapporté par al-Bukhârî et Muslim."],
["prophetes", 3, "Selon le hadith de l'intercession, qui fut le premier messager envoyé aux habitants de la Terre ?", "Nûh (Noé)", ["Âdam", "Idrîs", "Ibrâhîm"], "Hadith de l'intercession rapporté par al-Bukhârî et Muslim."],
["prophetes", 3, "Quel prophète Allah a-t-il « élevé à un haut rang », selon le Coran (19:57) ?", "Idrîs", ["Ilyâs", "Al-Yasaʿ", "Dhû l-Kifl"], "Le Coran le décrit aussi comme un homme véridique (19:56)."],
["piliers", 1, "Combien de prosternations fait-on dans chaque rakʿa ?", "2", ["1", "3", "4"], "On se prosterne deux fois, avec une courte position assise entre les deux."],
["piliers", 1, "Comment s'appelle l'inclinaison de la prière, les mains sur les genoux ?", "Le rukûʿ", ["Le sujûd", "Le qiyâm", "Le tachahhud"], "On s'incline le dos bien droit, puis on se relève avant de se prosterner."],
["piliers", 1, "Comment s'appelle l'aumône volontaire, donnée quand on veut ?", "La sadaqa", ["La zakât", "La kaffâra", "La fidya"], "Même une moitié de datte donnée en aumône a de la valeur (Bukhârî)."],
["piliers", 1, "Selon le Coran, qui peut ne pas jeûner pendant le Ramadan et rattraper plus tard ?", "Le malade et le voyageur", ["Celui qui travaille", "Celui qui fait du sport", "Celui qui a des examens"], "Ils rattrapent ensuite le même nombre de jours (2:184)."],
["piliers", 1, "Comment s'appelle le second appel, dit juste avant de commencer la prière en commun ?", "L'iqâma", ["L'adhân", "Le takbîr", "La khutba"], "Elle ressemble à l'adhân, mais elle est plus courte et dite plus vite."],
["piliers", 1, "Quelle est la dernière des 5 prières obligatoires de la journée ?", "Al-ʿIchâ'", ["Al-Maghrib", "Al-ʿAsr", "Adh-Dhuhr"], "Elle se prie à la nuit tombée et compte 4 rakʿa."],
["piliers", 1, "Quelle prière se fait entre celle du Dhuhr et celle du Maghrib ?", "Al-ʿAsr", ["Al-Fajr", "Al-ʿIchâ'", "Ad-Duhâ"], "C'est la prière de l'après-midi."],
["piliers", 1, "Comment s'appelle le bain rituel qui purifie tout le corps ?", "Le ghusl", ["Le wudû'", "Le tayammum", "Le tawâf"], "Il consiste à faire couler l'eau sur tout le corps, avec l'intention de se purifier."],
["piliers", 1, "Selon le hadith, les actes ne valent que par…", "… les intentions", ["… leur nombre", "… leur difficulté", "… le regard des gens"], "C'est le tout premier hadith du Sahîh d'al-Bukhârî."],
["piliers", 1, "Combien de jours compte le mois de Ramadan ?", "29 ou 30 jours", ["28 jours", "31 jours", "40 jours"], "Comme tous les mois lunaires, selon l'apparition du croissant (Bukhârî)."],
["piliers", 2, "Que dit-on dans l'inclinaison (rukûʿ) ?", "« Subhâna rabbiya l-ʿazîm »", ["« Subhâna rabbiya l-aʿlâ »", "« Allâhu akbar kabîrâ »", "« Rabbighfir lî »"], "Cela signifie « Gloire à mon Seigneur, le Très Grand » (Muslim)."],
["piliers", 2, "Quelle partie du corps essuie-t-on avec les mains mouillées, au lieu de la laver, pendant les ablutions ?", "La tête", ["Le visage", "Les bras", "La bouche"], "Le verset des ablutions le précise (5:6)."],
["piliers", 2, "Combien de fois au plus lave-t-on chaque membre pendant les ablutions, selon la sunna ?", "3", ["2", "5", "7"], "ʿUthmân a montré les ablutions du Prophète ﷺ en lavant les membres 3 fois (Bukhârî)."],
["piliers", 2, "Combien de rakʿa compte la prière du vendredi (Jumuʿa) ?", "2", ["3", "4", "6"], "Elle est précédée du sermon (khutba) et remplace le Dhuhr."],
["piliers", 2, "Comment s'appelle la prière pour demander à Allah de choisir le bien dans une décision ?", "La prière de l'istikhâra", ["La prière du witr", "La prière de l'istisqâ'", "La prière du tarâwîh"], "Le Prophète ﷺ l'enseignait comme il enseignait une sourate du Coran (Bukhârî)."],
["piliers", 2, "Comment s'appelle la prière impaire faite la nuit, après le ʿIchâ' ?", "Le witr", ["Le tarâwîh", "Le duhâ", "Le tachahhud"], "« Faites du witr votre dernière prière de la nuit » (Bukhârî, Muslim)."],
["piliers", 2, "Comment s'appelle la formule « Labbayk Allâhumma labbayk » répétée par les pèlerins ?", "La talbiya", ["La basmala", "Le takbîr", "La hawqala"], "Elle signifie « Me voici, ô Allah, me voici » (Bukhârî)."],
["piliers", 2, "Combien de rakʿa obligatoires fait-on en tout chaque jour ?", "17", ["15", "20", "12"], "2 + 4 + 4 + 3 + 4 = 17."],
["piliers", 2, "Comment s'appelle la position assise où l'on récite « At-tahiyyâtu lillâh » ?", "Le tachahhud", ["Le rukûʿ", "Le qiyâm", "Le sujûd"], "Le Prophète ﷺ l'enseignait à Ibn Masʿûd avec soin (Bukhârî)."],
["piliers", 3, "Comment s'appelle la prière pour demander la pluie ?", "Salât al-istisqâ'", ["Salât al-kusûf", "Salât ad-duhâ", "Salât al-istikhâra"], "Le Prophète ﷺ sortait la faire en plein air, avec les gens (Bukhârî)."],
["piliers", 3, "Quelle prière fait-on lors d'une éclipse de soleil ou de lune ?", "Salât al-kusûf", ["Salât al-istisqâ'", "Salât al-janâza", "Salât al-ʿîd"], "« Le soleil et la lune sont deux signes d'Allah » (Bukhârî, Muslim)."],
["piliers", 3, "Comment s'appelle la prière surérogatoire faite le matin, après le lever du soleil ?", "Salât ad-duhâ", ["Salât al-witr", "Salât at-tahajjud", "Salât al-janâza"], "Le Prophète ﷺ l'a recommandée à Abû Hurayra (Bukhârî, Muslim)."],
["piliers", 3, "Combien de catégories de personnes peuvent recevoir la zakât, selon le Coran ?", "8", ["4", "6", "10"], "Elles sont citées dans la sourate At-Tawba (9:60), dont les pauvres et les endettés."],
["piliers", 3, "En dehors du Ramadan, pendant quel mois le Prophète ﷺ jeûnait-il le plus ?", "Chaʿbân", ["Rajab", "Muharram", "Chawwâl"], "Selon ʿÂ'icha (Bukhârî, Muslim)."],
["piliers", 3, "Comment appelle-t-on les 13, 14 et 15 de chaque mois lunaire, où le jeûne est recommandé ?", "Les jours blancs (ayyâm al-bîd)", ["Les jours de tachrîq", "Les jours de ʿArafa", "Les jours de l'Aïd"], "Ce sont les nuits de pleine lune ; hadith rapporté par an-Nasâ'î et at-Tirmidhî."],
["piliers", 3, "Dans quelle vallée les pèlerins séjournent-ils pendant les jours de tachrîq ?", "Minâ", ["Muzdalifa", "ʿArafa", "Badr"], "Ils y lancent les cailloux sur les stèles (2:203)."],
["histoire", 1, "Dans quelle ville se trouve la grande mosquée Hassan II ?", "Casablanca", ["Rabat", "Marrakech", "Fès"], "Inaugurée en 1993, elle est construite en partie au-dessus de l'océan Atlantique."],
["histoire", 1, "Dans quelle ville se trouve la célèbre mosquée de la Koutoubia ?", "Marrakech", ["Casablanca", "Tanger", "Agadir"], "Son minaret du XIIe siècle a inspiré d'autres tours, comme la Giralda de Séville."],
["histoire", 1, "Quel détroit porte le nom du général Târiq ibn Ziyâd ?", "Le détroit de Gibraltar", ["Le détroit du Bosphore", "Le détroit d'Ormuz", "Le Pas de Calais"], "Gibraltar vient de l'arabe « Jabal Târiq », la montagne de Târiq."],
["histoire", 1, "Dans quel pays se trouvent aujourd'hui La Mecque et Médine ?", "L'Arabie saoudite", ["L'Égypte", "La Jordanie", "Le Yémen"], "Ces deux villes sont situées dans la région du Hijaz."],
["histoire", 1, "Quel pays compte aujourd'hui le plus de musulmans au monde ?", "L'Indonésie", ["L'Arabie saoudite", "L'Égypte", "La Turquie"], "L'islam s'y est surtout répandu grâce aux marchands."],
["histoire", 1, "Quelle boisson, venue du Yémen, s'est répandue dans le monde grâce aux musulmans ?", "Le café", ["Le thé", "Le chocolat chaud", "La limonade"], "On le buvait au Yémen pour rester éveillé la nuit avant de le diffuser vers La Mecque, Le Caire et Istanbul."],
["histoire", 1, "Quels chiffres utilisés aujourd'hui en Europe ont été transmis par les savants musulmans ?", "Les chiffres arabes", ["Les chiffres romains", "Les chiffres grecs", "Les chiffres chinois"], "Venus d'Inde, ils ont été diffusés grâce aux savants du monde musulman, comme al-Khwârizmî."],
["histoire", 1, "Dans quelle ville se trouve la Mosquée bleue (mosquée du sultan Ahmed) ?", "Istanbul", ["Ankara", "Le Caire", "Damas"], "Construite au début du XVIIe siècle, elle doit son nom à ses milliers de carreaux bleus."],
["histoire", 1, "Quelle grande mosquée a été inaugurée en 1926 en hommage aux soldats musulmans morts pour la France ?", "La Grande Mosquée de Paris", ["La mosquée de Lyon", "La mosquée de Marseille", "La mosquée de Strasbourg"], "Elle se trouve dans le 5e arrondissement de Paris."],
["histoire", 1, "Dans quel pays se trouve la mosquée-université Al-Azhar ?", "L'Égypte", ["Le Maroc", "La Tunisie", "La Syrie"], "Fondée au Caire au Xe siècle, elle est l'un des plus anciens lieux d'enseignement du monde."],
["histoire", 2, "Dans quel pays se trouve la ville de Kairouan et sa célèbre Grande Mosquée ?", "La Tunisie", ["Le Maroc", "L'Algérie", "La Libye"], "La ville a été fondée vers 670 par ʿUqba ibn Nâfiʿ."],
["histoire", 2, "Sous quel nom le philosophe et juge andalou Ibn Rushd est-il connu en Europe ?", "Averroès", ["Avicenne", "Alhazen", "Rhazès"], "Né à Cordoue au XIIe siècle, il fut aussi médecin et juge."],
["histoire", 2, "Quel savant andalou du IXe siècle a tenté de voler avec des ailes ?", "ʿAbbâs ibn Firnâs", ["Ibn Battûta", "Al-Bîrûnî", "Ibn Rushd"], "Un cratère de la Lune et un pont de Cordoue portent son nom."],
["histoire", 2, "Quel architecte ottoman a construit des centaines de mosquées et de ponts ?", "Mimar Sinan", ["Mehmed II", "Soliman", "Ibn Khaldûn"], "Son chef-d'œuvre est la mosquée Selimiye d'Edirne."],
["histoire", 2, "Quel sultan ottoman est surnommé « le Magnifique » en Europe ?", "Soliman", ["Mehmed II", "Osman Ier", "Sélim Ier"], "En Turquie, on l'appelle « Kanunî », le législateur."],
["histoire", 2, "Quel calife abbasside a offert une horloge à eau à l'empereur Charlemagne ?", "Hârûn ar-Rachîd", ["ʿUmar ibn ʿAbd al-ʿAzîz", "Muʿâwiya", "Al-Walîd Ier"], "Il est aussi connu grâce aux contes des « Mille et Une Nuits »."],
["histoire", 2, "Quelle invention chinoise les musulmans ont-ils fait connaître au reste du monde, depuis Samarcande ?", "Le papier", ["La boussole", "La poudre", "L'imprimerie"], "Après 751, sa fabrication s'est répandue de Samarcande à Bagdad, puis jusqu'en Europe."],
["histoire", 2, "Dans quelle ville d'Ouzbékistan est né l'imam al-Bukhârî ?", "Boukhara", ["Samarcande", "Tachkent", "Bagdad"], "Son nom « al-Bukhârî » signifie justement « celui de Boukhara »."],
["histoire", 2, "Quelle ville du Mali était célèbre pour ses savants et ses manuscrits ?", "Tombouctou", ["Bamako", "Dakar", "Niamey"], "Des milliers de manuscrits anciens y sont encore conservés."],
["histoire", 3, "Quel médecin andalou est considéré comme l'un des pères de la chirurgie ?", "Az-Zahrâwî (Abulcasis)", ["Ibn Sînâ (Avicenne)", "Ibn Rushd (Averroès)", "Ar-Râzî (Rhazès)"], "Il a décrit et dessiné plus de 200 instruments chirurgicaux."],
["histoire", 3, "Quel géographe a dessiné une carte du monde pour le roi Roger II de Sicile ?", "Al-Idrîsî", ["Ibn Battûta", "Al-Khwârizmî", "Ibn Khaldûn"], "Cette carte, terminée en 1154, fut l'une des plus précises de son époque."],
["histoire", 3, "Quel ingénieur a décrit de nombreuses machines, dont la célèbre « horloge éléphant » ?", "Al-Jazarî", ["Al-Bîrûnî", "Ibn Firnâs", "Al-Idrîsî"], "Son livre sur les machines ingénieuses date de 1206."],
["histoire", 3, "Quel roi du Mali a fait un célèbre pèlerinage à La Mecque en 1324 avec beaucoup d'or ?", "Mansa Moussa", ["Soundiata Keïta", "Askia Mohammed", "Sonni Ali"], "Il passa par Le Caire et y distribua tant d'or que son prix baissa."],
["histoire", 3, "Quel amiral chinois musulman a mené de grandes expéditions maritimes au XVe siècle ?", "Zheng He", ["Marco Polo", "Ibn Mâjid", "Kubilaï Khan"], "Ses flottes ont navigué jusqu'en Arabie et sur la côte de l'Afrique de l'Est."],
["histoire", 3, "Quel savant a calculé le rayon de la Terre avec une grande précision au XIe siècle ?", "Al-Bîrûnî", ["Al-Jazarî", "Ibn Sînâ", "Al-Idrîsî"], "Il utilisa la hauteur d'une montagne et l'angle de l'horizon."],
["histoire", 3, "Quel calife omeyyade a fait construire la Grande Mosquée de Damas ?", "Al-Walîd Ier", ["Muʿâwiya", "Hârûn ar-Rachîd", "Al-Ma'mûn"], "Elle fut construite au début du VIIIe siècle et reste l'une des plus anciennes grandes mosquées."],
["culture", 1, "Comment s'appelle la tour d'une mosquée d'où l'on appelait à la prière ?", "Le minaret", ["Le minbar", "Le mihrâb", "La coupole"], "Le mot vient de l'arabe « manâra », le lieu de la lumière."],
["culture", 1, "Comment s'appelle le tissu noir brodé d'or qui recouvre la Kaʿba ?", "La kiswa", ["L'ihrâm", "Le tapis", "La qibla"], "Elle est remplacée chaque année."],
["culture", 1, "Que signifie « Bârak Allâhu fîk » ?", "Qu'Allah te bénisse", ["Qu'Allah te pardonne", "Qu'Allah te guide", "Qu'Allah te protège"], "On le dit souvent pour remercier ou féliciter quelqu'un."],
["culture", 1, "Que signifie « harâm » ?", "Interdit", ["Permis", "Recommandé", "Pur"], "C'est le contraire de « halâl », qui signifie permis."],
["culture", 1, "Que signifie « Lâ ilâha illâ Llâh » ?", "Il n'y a de dieu qu'Allah", ["Allah est le plus grand", "Gloire à Allah", "Louange à Allah"], "C'est la première partie de la chahâda, l'attestation de foi."],
["culture", 1, "Que signifie le mot « duʿâ' » ?", "L'invocation", ["La prière obligatoire", "Le jeûne", "L'aumône"], "C'est demander à Allah, à tout moment et dans n'importe quelle langue."],
["culture", 1, "Comment appelle-t-on un compagnon du Prophète ﷺ ?", "Un sahâbî", ["Un tâbiʿî", "Un hâfiz", "Un imam"], "Au pluriel, on dit « les sahâba »."],
["culture", 1, "Que souhaite-t-on à quelqu'un le jour de la fête ?", "« ʿÎd mubârak »", ["« Ramadân karîm »", "« Jumuʿa mubâraka »", "« Hajj mabrûr »"], "Formule courante qui signifie « bonne fête bénie »."],
["culture", 1, "Comment appelle-t-on une personne qui a accompli le pèlerinage à La Mecque ?", "Hâjj (ou Hâjja)", ["Hâfiz", "Imam", "Muezzin"], "Dans beaucoup de familles, on appelle ainsi les grands-parents qui ont fait le pèlerinage."],
["culture", 1, "Que signifie le mot « Umma » ?", "La communauté des croyants", ["La mère", "La mosquée", "La ville sainte"], "Il désigne l'ensemble des musulmans dans le monde."],
["culture", 2, "Comment s'appelle la niche qui indique la direction de La Mecque dans une mosquée ?", "Le mihrâb", ["Le minbar", "Le minaret", "Le mashrabiyya"], "L'imam se place devant le mihrâb pour diriger la prière."],
["culture", 2, "Comment s'appelle la chaire à marches d'où l'imam fait le sermon du vendredi ?", "Le minbar", ["Le mihrâb", "Le minaret", "La qibla"], "Le minbar du Prophète ﷺ à Médine avait 3 marches."],
["culture", 2, "Comment appelle-t-on la génération qui a suivi les compagnons du Prophète ﷺ ?", "Les tâbiʿûn", ["Les sahâba", "Les Ansâr", "Les Muhâjirûn"], "Ce sont ceux qui ont connu les compagnons sans avoir vu le Prophète ﷺ."],
["culture", 2, "Pour quel jeune compagnon le Prophète ﷺ a-t-il invoqué : « Ô Allah, enseigne-lui le Livre » ?", "Ibn ʿAbbâs", ["Anas ibn Mâlik", "Usâma ibn Zayd", "Abû Hurayra"], "Il devint un grand savant du Coran (Bukhârî)."],
["culture", 2, "Quel compagnon le Prophète ﷺ a-t-il envoyé au Yémen en lui disant d'appeler d'abord à l'unicité d'Allah ?", "Muʿâdh ibn Jabal", ["Bilâl ibn Rabâh", "Abû Hurayra", "Salmân al-Fârisî"], "Hadith rapporté par al-Bukhârî et Muslim."],

  game.used.forEach(id => { const u = Q[id]; if (u) { usedTxt.add(nk(u.q)); usedAns.add(u.th + "|" + nk(u.a)); } });

  const notUsed = all.filter(q => !usedIds.has(q.id) && !usedTxt.has(nk(q.q)));

    const catTxt = new Set(all.map(q => nk(q.q)));
    const keep = seen.filter(id => !catTxt.has(nk(Q[id].q)));
    seen.length = 0; seen.push(...keep); fresh = cand.slice();

  const dist = q => q.d < lo ? lo - q.d : q.d > hi ? q.d - hi : 0;
  const score = q => dist(q) * 2 + (usedAns.has(q.th + "|" + nk(q.a)) ? 1 : 0);
  const best = Math.min(...fresh.map(score));
  const q = shuffle(fresh.filter(x => score(x) === best))[0];

  const i = seen.indexOf(q.id); if (i >= 0) seen.splice(i, 1); seen.push(q.id);

}
